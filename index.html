  {id:'dale1',who:'dale',lvl:2,title:"Dale's First Run",intro:'Morning! I drive goods to the towns down the road. Load my truck and I will bring back the money. Towns pay in XP too, if you know what I mean.',
    steps:[{txt:'Send a delivery with Dale',stat:'delivSent',n:1},{txt:'Complete 2 deliveries',stat:'deliver',n:2}],reward:{coins:250,xp:35,item:'deco:towerclock'}},
  {id:'hank1',who:'hank',lvl:5,title:"Hank's Feed Problem",intro:'My cows eat me out of house and home! Build yourself a Feed Mill so you never run short, then help me fill my feed trough.',
    steps:[{txt:'Build a Feed Mill',own:'mk:feedmill',n:1},{txt:'Bring Hank 20 animal feed',have:'feed',n:20},{txt:'Feed your animals 5 times',stat:'feed',n:5}],reward:{coins:300,xp:45,item:'deco:hay'}},
  {id:'otis1',who:'otis',lvl:6,title:"Otis's Orchard",intro:'Nothing beats fruit straight off the branch. Plant a few trees of your own, and save me some apples for my pies.',
    steps:[{txt:'Have 3 fruit trees',own:'tree',n:3},{txt:'Pick fruit 10 times',stat:'tree',n:10},{txt:'Bring Otis 8 apples',have:'t_apple',n:8}],reward:{coins:450,xp:60,item:'deco:pumpkins'}},
  {id:'rosa1',who:'rosa',lvl:7,title:"Rosa's Ranch Dream",intro:'I want the happiest animals in the valley, and I bet you can raise some too. Show me a busy barnyard!',
    steps:[{txt:'Have 6 animals',own:'animal',n:6},{txt:'Collect from animals 15 times',stat:'animal',n:15},{txt:'Bring Rosa 10 eggs',have:'a_chicken',n:10}],reward:{coins:600,xp:80,item:'deco:goldcow'}},
  {id:'juniper1',who:'juniper',lvl:8,title:'Busy Bees',intro:'The bees are buzzing and I need your help! A hive near flowers makes the sweetest honey.',
    steps:[{txt:'Build a Beehive',own:'mk:beehive',n:1},{txt:'Plant 15 seeds',stat:'plant',n:15},{txt:'Bring Juniper 5 honey',have:'honey',n:5}],reward:{coins:800,xp:100,item:'deco:greenhouse'}},
  {id:'dale2',who:'dale',lvl:9,title:'The Big Contract',intro:'A big buyer in Harbor Town wants regular deliveries. If we pull this off, everyone will know your farm.',
    steps:[{txt:'Complete 5 deliveries',stat:'deliver',n:5},{txt:'Fill 4 neighbor orders',stat:'order',n:4},{txt:'Make 6 goods in your buildings',stat:'make',n:6}],reward:{coins:1200,xp:140,cash:2}},
  {id:'mabel2',who:'mabel',lvl:10,title:'Harvest Festival',intro:'The whole valley is coming to the Harvest Festival, and we need the finest food on the table. Will you bake for us?',
    steps:[{txt:'Bring Mabel 2 pumpkin pies',have:'pie',n:2},{txt:'Harvest 3 golden crops',stat:'golden',n:3},{txt:'Bring Mabel 3 apple ciders',have:'applecider',n:3}],reward:{coins:2500,xp:250,cash:3,item:'deco:gazebo'}}
];
const PEOPLE=()=>[...NEIGHBORS,DRIVER];
function qDef(){return S.q&&QUESTS.find(q=>q.id===S.q.id)}
function ownCount(what){let n=0;for(const k in S.tiles){const o=S.tiles[k];if(what==='tree'?o.k==='tree':what==='animal'?o.k==='animal':o.k==='mk'&&'mk:'+o.id===what)n++}return n}
function stepProg(st){
  if(st.stat)return Math.min(st.n,(S.stats[st.stat]||0)-(S.q.base||0));
  if(st.own)return Math.min(st.n,ownCount(st.own));
  return Math.min(st.n,have(st.have));
}
function startStep(){const st=qDef().steps[S.q.step];S.q.base=st.stat?(S.stats[st.stat]||0):0}
function nextQuest(){if(VIS||S.q||typeof S.tut==='number'&&S.tut<TUT.length)return;const done=S.qdone||[];const q=QUESTS.find(q=>!done.includes(q.id)&&q.lvl<=S.level);if(q)offerQuest(q)}
function offerQuest(q){
  const who=PEOPLE().find(p=>p.id===q.who);S.q={id:q.id,step:0,base:0};startStep();save();
  modal({title:'New Quest',color:'gold',small:true,render(b){
    const p=el('div','body-pad'),face=el('div','vface');face.innerHTML=avatar(who);p.appendChild(face);
    p.appendChild(el('h3',null,q.title));p.appendChild(el('p',null,who.name+': "'+q.intro+'"'));
    const ul=el('ol','qsteps');for(const st of q.steps)ul.appendChild(el('li',null,st.txt));p.appendChild(ul);
    p.appendChild(rewardRow([['coins',q.reward.coins],['xp',q.reward.xp],['cash',q.reward.cash||0]]));
    const go=el('button','go',"Let's do it!");go.dataset.focus='1';go.onclick=()=>{closeModal();renderQuest()};p.appendChild(go);b.appendChild(p);
  }});
  SFX.find();renderQuest();
}
function checkQuest(){
  if(!S||!S.q)return;const q=qDef();if(!q){S.q=null;renderQuest();return}
  let moved=false;
  while(S.q&&S.q.step<q.steps.length){const st=q.steps[S.q.step];if(st.have||stepProg(st)<st.n)break;S.q.step++;moved=true;if(S.q.step<q.steps.length)startStep()}
  if(S.q.step>=q.steps.length){finishQuest();return}
  if(moved){SFX.find();toast('Quest step done! Next: '+q.steps[S.q.step].txt+'.')}
  renderQuest();
}
function handOver(){
  const q=qDef(),st=q.steps[S.q.step];if(!st.have||have(st.have)<st.n){SFX.error();toast('You need '+st.n+' '+ITEMS[st.have].name.toLowerCase()+' in the barn.');return}
  takeGood(st.have,st.n);S.q.step++;SFX.coin();toast('Handed over '+st.n+' '+ITEMS[st.have].name.toLowerCase()+'.');
  if(S.q.step<q.steps.length)startStep();changed();checkQuest();
}
function finishQuest(){
  const q=qDef(),who=PEOPLE().find(p=>p.id===q.who),r=q.reward;
  const hl0=houseLv();S.qdone=[...(S.qdone||[]),q.id];S.q=null;const houseUp=houseLv()>hl0;S.coins+=r.coins;if(r.cash)S.cash+=r.cash;
  let prize=null;if(r.item){S.inv[r.item]=(S.inv[r.item]||0)+1;const[cat,id]=r.item.split(':');prize=DECOR[id]}
  SFX.level();confetti();stat('quest');
  modal({title:'Quest Complete!',color:'gold',small:true,render(b){
    const p=el('div','body-pad'),face=el('div','vface');face.innerHTML=avatar(who);p.appendChild(face);
    p.appendChild(el('h3',null,q.title));p.appendChild(el('p',null,who.name+': "Thank you so much! Here is something for your trouble."'));
    p.appendChild(rewardRow([['coins',r.coins],['xp',r.xp],['cash',r.cash||0],['text',prize?prize.name+' (in your Gift Box)':0]]));
    if(houseUp)p.appendChild(el('p','hint','Your farmhouse got an upgrade! Take a look.'));
    const go=el('button','go','Wonderful!');go.dataset.focus='1';go.onclick=()=>{closeModal();setTimeout(nextQuest,600)};p.appendChild(go);b.appendChild(p);
  }});
  addXP(r.xp);changed();renderQuest();
}
function renderQuest(){
  const box=$('qtrack');if(!box||!S)return;const q=qDef();
  if(!q||VIS){box.hidden=true;return}
  const who=PEOPLE().find(p=>p.id===q.who),st=q.steps[S.q.step],pr=stepProg(st),open=S.tips.questOpen!==false&&!(matchMedia('(max-width:640px)').matches&&S.tips.questOpen===undefined);
  const key=q.id+':'+S.q.step,moved=box.dataset.k&&box.dataset.k!==key;box.dataset.k=key;
  box.hidden=false;box.className='qtrack'+(open?'':' closed');box.innerHTML='';
  const head=el('button','qhead');head.setAttribute('aria-expanded',String(open));head.innerHTML=avatar(who)+'<span><small>Quest</small></span><i>'+(S.q.step+1)+'/'+q.steps.length+'</i>';head.querySelector('span').append(q.title);
  head.onclick=()=>foldPanel(box,head,'questOpen');box.appendChild(head);
  const fold=el('div','qfold'),body=el('div','qbody');
  body.appendChild(el('p','qnow',st.txt));
  const bar=el('div','gbar'),fill=el('b');bar.appendChild(fill);animBar(fill,'q:'+key,pr/st.n*100);
  const row=el('div','gmeta');row.appendChild(bar);row.appendChild(el('span',null,pr+'/'+st.n));body.appendChild(row);
  if(st.have){const h=el('button','claim','Hand over');h.disabled=pr<st.n;h.onclick=handOver;body.appendChild(h)}
  if(q.steps.length>1){const ol=el('ol','qsteplist');q.steps.forEach((x,i)=>ol.appendChild(el('li',i<S.q.step?'done':i===S.q.step?'now':'later',x.txt)));body.appendChild(ol)}
  body.appendChild(rewardChips(q.reward));
  fold.appendChild(body);box.appendChild(fold);

// Small reward chips (coins, XP, prize) shown on quest cards before you earn them.
function rewardChips(r){
  const w=el('div','qrew');w.appendChild(el('span',null,'Reward'));
  const chip=(html,txt)=>{const c=el('span','rchip');c.innerHTML=html;c.append(txt);w.appendChild(c)};
  if(r.coins)chip('<span class="coin"></span>',r.coins.toLocaleString());
  if(r.xp)chip('<span class="xpdot"></span>',r.xp+' XP');
  if(r.cash)chip('<span class="bill" style="width:16px;height:12px;font-size:8px;border-width:1px">$</span>',String(r.cash));
  if(r.item){const[,id]=r.item.split(':'),d=DECOR[id];if(d){const ik='decor:'+id;if(!ICONS[ik])ICONS[ik]=renderIcon('decor',id);chip('<img alt="" src="'+ICONS[ik]+'">',d.name)}}
  return w;
}
// Open or close a side panel in place, so the fold animates instead of the panel being rebuilt.
function foldPanel(box,head,tip){const open=box.classList.toggle('closed')===false;S.tips[tip]=open;head.setAttribute('aria-expanded',String(open));SFX.click();save()}
// Progress bars remember their last width and grow from there, so every re-render animates.
const BAR_W={};
function animBar(fill,key,pct){
  pct=Math.max(0,Math.min(100,pct));const from=BAR_W[key];BAR_W[key]=pct;
  if(from==null||reduce||from===pct){fill.style.width=pct+'%';return}
  fill.style.width=from+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>fill.style.width=pct+'%'));
}
function flash(e){if(reduce)return;e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),950)}

/* ================= daily bonus ================= */
function dailyBonus(){
  const t=today();if(S.daily.last===t)return;
  const streak=S.daily.last===yesterday()?Math.min(5,S.daily.streak+1):1;
  modal({title:'Daily Bonus',color:'green',small:true,noClose:true,render(b){
    const p=el('div','body-pad');p.appendChild(el('p',null,'Welcome back to Farm Village! Come back every day for bigger rewards.'));
    const days=el('div','days');
    DAILY.forEach((r,i)=>{const d=el('div','day'+(i+1<streak?' done':i+1===streak?' today':''));d.appendChild(el('b',null,'Day '+(i+1)));
      d.appendChild(el('span',null,r.coins+' coins'));if(r.fuel)d.appendChild(el('span',null,'+'+r.fuel+' fuel'));if(r.cash)d.appendChild(el('span',null,'+'+r.cash+' Farm Cash'));days.appendChild(d)});
    p.appendChild(days);
    const go=el('button','go','Collect');go.dataset.focus='1';
    go.onclick=()=>{
      const r=DAILY[streak-1];S.daily={last:t,streak};S.coins+=r.coins;if(r.cash)S.cash+=r.cash;
      if(r.fuel){fuelNow();S.fuel=Math.min(FUEL_MAX,S.fuel+r.fuel)}
      SFX.coin();toast('Daily bonus: +'+r.coins+' coins'+(r.cash?' and '+r.cash+' Farm Cash':'')+'!');changed();closeModal();
    };
    p.appendChild(go);b.appendChild(p);
  }});
}

/* ================= screen orientation ================= */
// The player picks portrait, landscape or auto (on the title screen or in Settings). Where the browser allows it
// (installed app, or full screen on Android) the screen is locked; elsewhere a card asks to turn the phone.
const ORIENT_KEY='farm-village-orient';
function orientPref(){try{return localStorage.getItem(ORIENT_KEY)}catch(e){return null}}
function isPhone(){return matchMedia('(pointer: coarse)').matches&&Math.min(screen.width,screen.height)<900}
function setOrient(v,apply){try{localStorage.setItem(ORIENT_KEY,v)}catch(e){}renderOrientPick();if(apply)lockOrient();checkOrient()}
async function lockOrient(){
  const v=orientPref();if(!isPhone()||!screen.orientation)return;
  if(!v||v==='auto'){try{screen.orientation.unlock()}catch(e){}return}
  try{if(!document.fullscreenElement&&!matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}
  try{await screen.orientation.lock(v)}catch(e){}
  checkOrient();
}
let rotKept=false;
function checkOrient(){
  const v=orientPref(),r=$('rotate');if(!r)return;
  const port=matchMedia('(orientation: portrait)').matches,wrong=isPhone()&&!rotKept&&(v==='portrait'&&!port||v==='landscape'&&port);
  if(wrong){$('rotTitle').textContent=v==='portrait'?'Turn your phone upright':'Turn your phone sideways';$('rotText').textContent=v==='portrait'?'You chose to play in portrait.':'You chose to play in landscape.'}
  r.hidden=!wrong;
}
$('rotKeep').onclick=()=>{SFX.click();setOrient(matchMedia('(orientation: portrait)').matches?'portrait':'landscape',false);rotKept=true;checkOrient()};
addEventListener('resize',()=>setTimeout(checkOrient,120));
function renderOrientPick(){
  const t=$('torient');if(!t)return;const v=orientPref()||'auto';t.querySelectorAll('button').forEach(b=>b.remove());
  for(const[c,n]of[['portrait','Portrait'],['landscape','Landscape'],['auto','Auto']]){const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-pressed',String(v===c));b.onclick=()=>{SFX.click();setOrient(c,false)};t.appendChild(b)}
}
renderOrientPick();

/* ================= boot ================= */
function start(data){
  S=norm(valid(data&&data.S)?data.S:(load()||fresh()));
  N=S.size;
  for(const k in S.tiles){const o=S.tiles[k];if(o.k==='bld'){farmer.x=+k.split(',')[0]+2.4;farmer.y=+k.split(',')[1]+2.6;break}}
  resize();buildBorder();buildOcc();if(syncHousing())buildOcc();buildBars();renderModeSw();renderNeighbors();hud();save();placePet();setTool('multi');
  window.claude?.hot?.snapshot?.(()=>({S}));
  requestAnimationFrame(frame);
  setInterval(save,10000);
  const first=!S.tips.welcome;S.tips.welcome=true;
  if(S.tips.homeGift===false){S.tips.homeGift=true;setTimeout(()=>toast('Animals now live in homes! Free homes for your animals are waiting in your Gift Box.'),1500)}
  else if(!S.tips.homes&&Object.values(S.tiles).some(o=>o.k==='animal'&&!hasHome(o.id))){S.tips.homes=true;setTimeout(()=>toast('Your chickens and sheep need homes! Buy a Chicken Coop and a Sheep Pen in Market > Homes.'),3200)}
  if(first)toast('Welcome to Farm Village! Your wheat is ready: click it and your farmer will harvest it.');
  if(!S.tips.avatar)showWardrobe(true);
  dailyBonus();
  renderGoals();setInterval(()=>{if(S.goals&&S.goals.day!==today())renderGoals()},60000);
  tickOrders();tickDeliv();renderQuest();setTimeout(()=>{if($('title').hidden)nextQuest()},4000);
  showTitle();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
// Installed-app support: works offline once loaded. Skipped where service workers are not allowed (for example inside claude.ai).
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude\.ai$/.test(location.hostname))navigator.serviceWorker.register('sw.js').then(r=>{addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})}).catch(()=>{});
let installEvt=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});addEventListener('appinstalled',()=>{installEvt=null;toast('Farm Village is installed!')});
})();
