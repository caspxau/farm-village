<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clover Hollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen isometric farm canvas. Level/XP/coins/cash float top-left, farm menus top-right, neighbors bottom-left, tools bottom-right; every panel opens in one shared modal. One committed sunny-meadow world. */
:root{
  --meadow:#8cc84b;
  --paper:#fffaf0;
  --wood:#b4723a;
  --wood-d:#6b3c15;
  --gold:#ffc72c;
  --xp:#2d8fe3;
  --cash:#3faa4a;
  --ink:#3a2310;
  --leaf:#3f9a3c;
  --danger:#d9402f;
  --f-display:'Luckiest Guy','Arial Black',Impact,sans-serif;
  --f-body:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--meadow);color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
#farm{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#farm.grab{cursor:grabbing}
.outline{color:#fff;text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
.outline-s{color:#fff;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink),0 2px 0 var(--ink)}

.hud{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;gap:10px;pointer-events:none;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.lvl{display:flex;align-items:center}
.star{position:relative;width:64px;height:64px;flex:0 0 64px;z-index:1;filter:drop-shadow(0 3px 0 var(--wood-d))}
.star svg{width:100%;height:100%;display:block}
.star span{position:absolute;inset:0;display:grid;place-items:center;padding-top:6px;font-family:var(--f-display);font-size:24px}
.xpbox{margin-left:-14px;background:var(--paper);border:3px solid var(--wood-d);border-radius:0 14px 14px 0;padding:6px 12px 6px 20px;min-width:170px}
.xpbar{height:14px;border-radius:7px;background:#d9e7f2;border:2px solid #1f5f9a;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(#6cc0ff,var(--xp));transition:width .35s}
.xptext{display:block;font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--wood-d);border-radius:999px;padding:5px 14px 5px 6px;margin-top:10px}
.pill b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 45%,#d99500);border:2px solid #9a6400;flex:0 0 28px;display:inline-block}
.bill{width:32px;height:22px;border-radius:4px;background:linear-gradient(#7fd88a,var(--cash));border:2px solid #1f6b28;flex:0 0 32px;display:inline-grid;place-items:center;font-family:var(--f-display);font-size:13px;color:#fff;line-height:1}
.right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sign{background:linear-gradient(#c98a4b,var(--wood));border:3px solid var(--wood-d);border-radius:10px;padding:6px 16px 4px;font-family:var(--f-display);font-size:22px;letter-spacing:1px;box-shadow:0 4px 0 var(--wood-d)}
.menu{display:flex;gap:6px}
.mbtn{position:relative;width:48px;height:48px;border-radius:12px;border:3px solid var(--wood-d);background:var(--paper);box-shadow:0 3px 0 var(--wood-d);display:grid;place-items:center;padding:0}
.mbtn svg{width:30px;height:30px}
.badge{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--danger);border:2px solid #fff;color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
.badge[hidden]{display:none}
.zoom{display:flex;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:3px solid var(--wood-d);background:var(--paper);font-family:var(--f-display);font-size:22px;line-height:1;box-shadow:0 3px 0 var(--wood-d);padding:0}

.toast{position:fixed;left:50%;top:96px;transform:translateX(-50%);pointer-events:none;z-index:30;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast span{display:block;background:var(--paper);border:3px solid var(--wood-d);border-radius:12px;padding:8px 16px;font-size:15px;text-align:center;box-shadow:0 4px 0 var(--wood-d);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.tip{position:fixed;z-index:25;pointer-events:none;background:rgba(58,35,16,.92);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;white-space:nowrap}
.tip[hidden]{display:none}
.rotbtn{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:20;border:3px solid var(--wood-d);border-radius:12px;background:linear-gradient(#ffe27a,#f2a21e);box-shadow:0 4px 0 var(--wood-d);font-family:var(--f-display);font-size:20px;padding:6px 18px;min-height:46px}
.rotbtn[hidden]{display:none}

.bottom{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:12px;pointer-events:none}
.bottom>*{pointer-events:auto}
.neighbors{display:flex;gap:8px;background:linear-gradient(#c98a4b,var(--wood));border:3px solid var(--wood-d);border-radius:14px;padding:8px;box-shadow:0 4px 0 var(--wood-d)}
.nb{width:80px;background:var(--paper);border:2px solid var(--wood-d);border-radius:10px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.nb svg,.nb .nbface{width:46px;height:46px;border-radius:8px;background:#bfe6ff;display:block}
.nb small{font-size:10px;color:#7a6650;margin-top:-2px}
.nb button{border:0;border-radius:8px;background:var(--leaf);color:#fff;font-size:12px;padding:3px 8px;min-height:26px;width:100%}
.nb button[disabled]{background:#b9ad98;cursor:default}
.nb-title{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-display);font-size:14px;color:#fff;letter-spacing:1px;align-self:center}
.tools{margin-left:auto;display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.chip{background:var(--paper);border:3px solid var(--wood-d);border-radius:12px;padding:4px 10px;font-size:12px;line-height:1.2;text-align:center;min-width:104px}
.chip b{display:block;font-size:14px}
button.chip{box-shadow:0 3px 0 var(--wood-d)}
.fuelbar{height:8px;border-radius:4px;background:#e5dccb;margin-top:3px;overflow:hidden}
.fuelbar i{display:block;height:100%;background:linear-gradient(90deg,#f2a21e,#e0352b)}
.tools-col{display:flex;gap:9px;padding-bottom:18px;flex-wrap:wrap;justify-content:flex-end}
.tool{width:58px;height:58px;border-radius:50%;border:3px solid var(--wood-d);background:radial-gradient(circle at 40% 30%,#ffe9b8,#f2b860 70%);box-shadow:0 4px 0 var(--wood-d);display:grid;place-items:center;padding:0;position:relative}
.tool svg{width:34px;height:34px}
.tool>span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;font-family:var(--f-display)}
.tool[aria-pressed="true"]{background:radial-gradient(circle at 40% 30%,#fff8c8,var(--gold) 70%);box-shadow:0 0 0 4px #fff,0 4px 0 4px var(--wood-d)}
.tool.market{width:74px;height:74px;background:radial-gradient(circle at 40% 30%,#c5ecff,#4fb0f0 70%)}
.tool.market svg{width:44px;height:44px}
.tool[hidden]{display:none}

.modal{position:fixed;inset:0;z-index:40;background:rgba(40,25,10,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.sheet{width:min(820px,100%);max-height:min(660px,100%);display:flex;flex-direction:column;background:var(--paper);border:4px solid var(--wood-d);border-radius:18px;box-shadow:0 6px 0 var(--wood-d);overflow:hidden;animation:pop .2s ease-out}
.sheet.wide{width:min(960px,100%);max-height:min(720px,100%)}
.sheet.small{width:min(420px,100%);text-align:center}
.sheet-head{background:linear-gradient(#5bbcf6,#2d8fe3);border-bottom:4px solid #1f5f9a;padding:10px 14px;display:flex;align-items:center;gap:12px}
.sheet-head.green{background:linear-gradient(#7fd88a,var(--cash));border-color:#1f6b28}
.sheet-head.gold{background:linear-gradient(#ffe27a,#f2a21e);border-color:#9a6400}
.sheet-head.pink{background:linear-gradient(#ff9ec0,#e0457b);border-color:#8a1f45}
.sheet-head.red{background:linear-gradient(#ff8a7a,#d9402f);border-color:#7a1c12}
.sheet-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:1px}
.close{margin-left:auto;width:40px;height:40px;border-radius:50%;border:3px solid #7a1c12;background:var(--danger);color:#fff;font-family:var(--f-display);font-size:20px;padding:0;flex:0 0 40px}
.sheet-body{overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;padding:10px 12px 0;background:#f3e6c9;flex-wrap:wrap;border-bottom:3px solid var(--wood-d)}
.tab{border:3px solid var(--wood-d);border-bottom:0;border-radius:10px 10px 0 0;background:#e0c79a;padding:6px 12px;min-height:40px;font-size:14px;margin-bottom:-3px}
.tab[aria-selected="true"]{background:var(--paper);padding-bottom:9px}
.grid{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.card{border:3px solid #d8c29a;border-radius:12px;background:#fff;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative}
.card img{width:120px;height:100px;display:block}
.card strong{font-size:15px;line-height:1.15}
.card small{font-size:12px;color:#6d5640;min-height:30px;line-height:1.25}
.card .stars{position:absolute;top:6px;left:8px;display:flex;gap:1px}
.card .stars svg{width:15px;height:15px}
.card .owned{position:absolute;top:6px;right:8px;background:var(--leaf);color:#fff;border-radius:8px;font-size:11px;padding:1px 6px}
.buy{border:0;border-radius:10px;background:var(--leaf);color:#fff;min-height:40px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;box-shadow:0 3px 0 #276b25;padding:0 6px}
.buy.needhome{background:#f2a21e;box-shadow:0 3px 0 #9a6400}
.buy .coin{width:18px;height:18px;flex-basis:18px;border-width:1px}
.buy .bill{width:24px;height:17px;flex-basis:24px;font-size:10px;border-width:1px}
.buy.cashbuy{background:#2f8a3a}
.buy[disabled]{background:#9c8f7c;box-shadow:none;cursor:default}
.card.locked{opacity:.6}
.empty{padding:28px 20px;text-align:center;color:#6d5640;max-width:46ch;margin:0 auto}
.body-pad{padding:18px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.body-pad p{margin:0;max-width:36ch}
.big{font-family:var(--f-display);font-size:40px;line-height:1}
.go{border:0;border-radius:12px;background:var(--leaf);color:#fff;font-family:var(--f-display);font-size:22px;letter-spacing:1px;padding:10px 28px;box-shadow:0 4px 0 #276b25;min-height:48px}
.go[disabled]{background:#9c8f7c;box-shadow:none;cursor:default}
.rewards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.reward{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #d8c29a;border-radius:10px;padding:4px 10px;font-size:15px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.day{border:3px solid #d8c29a;border-radius:10px;background:#fff;padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.day b{font-family:var(--f-display);font-weight:400;font-size:15px}
.day.done{background:#e6f5d8;border-color:#8cc84b}
.day.today{border-color:var(--gold);background:#fff6cf;box-shadow:0 0 0 3px var(--gold)}
.coll{padding:12px;display:flex;flex-direction:column;gap:12px}
.cset{border:3px solid #d8c29a;border-radius:14px;background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cset-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cset-head strong{font-size:17px}
.cset-head small{color:#6d5640}
.cset-head .go{margin-left:auto;font-size:16px;padding:6px 16px;min-height:40px}
.citems{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.citem{border:2px solid #eadcc0;border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:11px;text-align:center;position:relative;background:#fffdf7}
.citem svg{width:40px;height:40px}
.citem.none svg{opacity:.22;filter:grayscale(1)}
.citem i{position:absolute;top:2px;right:4px;font-style:normal;background:var(--xp);color:#fff;border-radius:8px;padding:0 5px;font-size:11px}
.ribbons{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rib{border:3px solid #d8c29a;border-radius:12px;background:#fff;padding:8px 10px;display:flex;gap:10px;align-items:center}
.rib svg{width:46px;height:56px;flex:0 0 46px}
.rib div{flex:1;min-width:0}
.rib strong{display:block;font-size:15px}
.rib small{display:block;font-size:12px;color:#6d5640}
.pbar{height:8px;border-radius:4px;background:#eee3cf;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--xp)}

input{user-select:text;-webkit-user-select:text}
.wd2{display:grid;grid-template-columns:1fr 236px;min-height:0;flex:1;overflow:hidden}
.wdmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.wdsubs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#fff3d6;border-bottom:2px solid #eadcc0}
.chip{border:2px solid #d8c29a;border-radius:999px;background:#fff;padding:3px 12px;min-height:32px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--gold);border-color:#9a6400}
.wdpanel{padding:10px 12px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.icard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 8px;border:2px solid #b9d6ee;border-radius:12px;background:linear-gradient(#ffffff,#e9f4fd)}
.icard.on{border-color:var(--xp);box-shadow:0 0 0 2px var(--xp)}
.icard strong{font-size:12px;line-height:1.1;text-align:center;min-height:14px}
.icard canvas{border-radius:10px;background:radial-gradient(circle at 50% 40%,#fff,#d7ebfa)}
.icard .use{border:0;border-radius:8px;background:#3f7fd0;color:#fff;font-size:12px;min-height:30px;width:100%}
.icard .use[aria-pressed="true"]{background:var(--leaf)}
.ptag{position:absolute;top:22px;right:6px;display:inline-flex;align-items:center;gap:2px;background:#fffaf0;border:1.5px solid #9a6400;border-radius:8px;font-size:11px;padding:0 4px}
.ptag .coin{width:11px;height:11px;flex-basis:11px;border-width:1px}.ptag .bill{width:15px;height:11px;flex-basis:15px;font-size:7px;border-width:1px}
.wdside{background:linear-gradient(#bfe6ff,#eaf7ff 34%,#fff7e6 34%);border-left:3px solid var(--wood-d);padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.wdstage{border-radius:12px;background:radial-gradient(circle at 70% 18%,#fff6b8 0,#fff6b8 18px,transparent 19px),linear-gradient(#9ed3f7,#d6efff 60%,#8fcf55 60%,#6fb63c);border:2px solid #6b3c15;display:grid;place-items:center}
.wdstage canvas{width:210px;max-width:100%;height:auto;aspect-ratio:210/230;display:block}
.pricetag{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fffaf0;border:2px dashed #9a6400;border-radius:10px;padding:6px 10px;font-size:13px}
.pnums{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}.pnums b{font-size:15px;margin-right:4px}
.pnums .coin{width:16px;height:16px;flex-basis:16px;border-width:1px}.pnums .bill{width:20px;height:14px;flex-basis:20px;font-size:9px;border-width:1px}
.wdrow{display:flex;gap:6px}.wdrow>*{flex:1}
.buynow{min-height:44px;font-size:16px;padding:6px 8px;white-space:nowrap}
.wdside .seg{flex-wrap:wrap;justify-content:center}.wdside .seg .opt{padding:3px 9px;min-height:32px}
.wfoot .go{margin-left:auto}.buynow:disabled{opacity:.5;cursor:default}
.wfoot .cancel{background:#fde3df;border-color:#7a1c12}
.wpreview{background:linear-gradient(#bfe6ff,#e8f6ff 62%,#9ed05a 62%);border-right:3px solid var(--wood-d);padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.wpreview canvas{width:200px;height:230px;display:block}
.seg{display:flex;gap:4px}
.field{display:flex;flex-direction:column;gap:3px;width:100%;font-size:13px;background:rgba(255,250,240,.92);border-radius:10px;padding:6px 8px}
.field input{font:inherit;font-size:15px;border:2px solid #d8c29a;border-radius:8px;padding:6px 8px;min-height:38px;background:#fff;color:var(--ink);width:100%}
.field input:focus-visible{outline:3px solid var(--xp);outline-offset:1px}
.wopts{display:flex;flex-direction:column;min-width:0}
.wpanel{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.wgroup h3{margin:0 0 6px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid #d8c29a;border-radius:10px;background:#fff;padding:5px 10px;min-height:38px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.opt[aria-pressed="true"]{border-color:var(--xp);box-shadow:0 0 0 2px var(--xp);background:#eef7ff}
.opt .coin{width:14px;height:14px;flex-basis:14px;border-width:1px}
.opt .bill{width:20px;height:14px;flex-basis:20px;font-size:9px;border-width:1px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d8c29a;padding:0}
.swc{position:relative;display:inline-block;background:conic-gradient(#f44,#fd4,#4d4,#4df,#44f,#f4f,#f44);cursor:pointer}
.swc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.swc:focus-within{outline:3px solid var(--xp);outline-offset:2px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--xp),0 0 0 5px #fff}
.wfoot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:3px solid #eadcc0;background:#fff7e6;flex-wrap:wrap;margin-top:auto}
.wfoot .note{flex:1 1 100%;font-size:13px}
.wfoot .btn2:first-of-type{margin-left:auto}
.btn2{border:3px solid var(--wood-d);border-radius:10px;background:var(--paper);padding:6px 14px;min-height:44px}
@media (max-width:640px){
  .wd2{grid-template-columns:1fr;overflow:auto}.wdside{border-left:0;border-top:3px solid var(--wood-d);order:-1}
  .wardrobe{grid-template-columns:1fr}
  .wpreview{border-right:0;border-bottom:3px solid var(--wood-d);flex-direction:row;flex-wrap:wrap;justify-content:center}
  .wpreview canvas{width:140px;height:161px}
}
@media (max-width:860px){.neighbors .nb:nth-of-type(n+3){display:none}.sign{display:none}}
@media (max-width:640px){
  .neighbors{display:none}
  .xpbox{min-width:120px}
  .tool{width:50px;height:50px}.tool svg{width:28px;height:28px}.tool.market{width:60px;height:60px}
  .chips{display:none}
  .citems{grid-template-columns:repeat(3,1fr)}
  .pill b{font-size:18px}
}

/* ================= theme: wood grain, parchment, motion ================= */
:root{--grain:repeating-linear-gradient(93deg,rgba(255,255,255,.07) 0 2px,rgba(80,40,10,.06) 2px 5px,rgba(255,255,255,0) 5px 12px);--parch:radial-gradient(circle at 18% 12%,#fffdf6,#fbf1dc 55%,#f1dfb8)}
.xpbox{background:var(--grain),linear-gradient(#fffaf0,#f1dfb8);box-shadow:0 4px 0 var(--wood-d),inset 0 2px 0 #fff}
.xpbar{height:16px;border-radius:8px;background:#cfe0ee;box-shadow:inset 0 2px 3px rgba(0,0,0,.22)}
.xpbar i{position:relative;overflow:hidden;background:linear-gradient(#9ad8ff,#2d8fe3 60%,#1f6fc0)}
.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.6) 48%,transparent 60%);background-size:220% 100%;animation:shine 2.8s linear infinite}
@keyframes shine{from{background-position:160% 0}to{background-position:-60% 0}}
.star::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:repeating-conic-gradient(rgba(255,226,110,.6) 0 10deg,transparent 10deg 30deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:spin 16s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{background:var(--grain),linear-gradient(#fffaf0,#f1dfb8);box-shadow:0 4px 0 var(--wood-d),inset 0 2px 0 #fff}
.pill.bump{animation:bump .45s ease-out}
@keyframes bump{35%{transform:scale(1.14) rotate(-2deg)}}
.pill .plus{width:24px;height:24px;border-radius:50%;border:2px solid #1f6b28;background:linear-gradient(#8fe09a,var(--cash));color:#fff;font-family:var(--f-display);font-size:17px;line-height:1;padding:0 0 1px;display:grid;place-items:center;box-shadow:0 2px 0 #1f6b28}
.sign{position:relative;margin-top:18px;background:var(--grain),linear-gradient(#e0a462,#a86a32);transform-origin:50% -18px;animation:sway 7s ease-in-out infinite}
.sign::before,.sign::after{content:"";position:absolute;top:-21px;width:3px;height:19px;background:linear-gradient(#8a6a3a,#5e3a1c);border-radius:2px}
.sign::before{left:20px}.sign::after{right:20px}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.menu{gap:14px}
.mbtn{background:var(--grain),linear-gradient(#fffaf0,#f0dab0);box-shadow:0 4px 0 var(--wood-d),inset 0 2px 0 #fff;transition:transform .12s,box-shadow .12s;margin-bottom:15px}
.mbtn:hover{transform:translateY(-3px)}
.mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.mbtn>em{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--f-display);font-size:10px;letter-spacing:.2px;white-space:nowrap;color:#fff;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink),0 2px 0 var(--ink)}
.badge{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.zoom button{background:var(--grain),linear-gradient(#fffaf0,#f0dab0);transition:transform .12s}
.zoom button:active{transform:translateY(2px)}
.neighbors{background:var(--grain),linear-gradient(#dc9e5c,#9a5e2a);box-shadow:0 5px 0 var(--wood-d),inset 0 2px 0 rgba(255,255,255,.3)}
.nb{background:linear-gradient(#fffdf6,#f1e2c2);transition:transform .15s;box-shadow:0 2px 0 rgba(60,30,10,.35)}
.nb:hover{transform:translateY(-4px) rotate(-1deg)}
.nb .nbface{border:2px solid var(--wood-d)}
.nb .nbface:hover{filter:brightness(1.08)}
.tool{transition:transform .12s}
.tool:hover{transform:translateY(-3px) scale(1.04)}
.tool:active{transform:translateY(2px)}
.tool.market{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 var(--wood-d),0 0 0 6px rgba(255,255,255,.45)}}
.chip{background:var(--grain),linear-gradient(#fffaf0,#f1dfb8)}
.toast span{position:relative;background:var(--grain),linear-gradient(#fffdf6,#f4e4c0);border-radius:14px;padding:9px 18px 9px 42px;animation:drop .4s cubic-bezier(.3,1.5,.6,1)}
.toast span::before{content:"";position:absolute;left:13px;top:50%;width:18px;height:18px;margin-top:-9px;background:radial-gradient(circle at 30% 30%,#a8e67e,#3f9a3c);border-radius:0 65% 0 65%;transform:rotate(-15deg);box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.modal{background:radial-gradient(circle,rgba(40,25,10,.3),rgba(40,25,10,.62));-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{background:var(--parch);border-radius:20px;box-shadow:0 7px 0 var(--wood-d),0 20px 40px rgba(30,15,5,.35);animation:popin .32s cubic-bezier(.3,1.45,.6,1)}
@keyframes popin{from{transform:scale(.82) translateY(24px);opacity:0}}
.sheet-head{position:relative;justify-content:center;min-height:60px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.sheet-head::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.sheet-head h2{position:relative;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.close{position:absolute;right:12px;top:50%;margin-top:-20px;transition:transform .2s;box-shadow:0 3px 0 #7a1c12}
.close:hover{transform:rotate(90deg) scale(1.06)}
.tabs{background:var(--grain),linear-gradient(#f3e0b8,#e9d2a4)}
.tab{background:var(--grain),linear-gradient(#ead2a2,#d9bb84);transition:transform .12s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:#fdf6e6}
.card{background:linear-gradient(#ffffff,#fff8ea);box-shadow:0 4px 0 #e2cfa8;transition:transform .15s,box-shadow .15s}
.card:not(.locked):hover{transform:translateY(-4px);box-shadow:0 8px 0 #e2cfa8,0 12px 18px rgba(80,50,10,.12)}
.card img{transition:transform .2s}
.card:not(.locked):hover img{transform:scale(1.06)}
.go{position:relative;overflow:hidden;background:linear-gradient(#6ccf5c,var(--leaf));transition:transform .12s}
.go::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg)}
.go:not([disabled]):hover::after{animation:sweep .7s ease-out}
.go:not([disabled]):active{transform:translateY(3px);box-shadow:0 1px 0 #276b25}
@keyframes sweep{to{left:130%}}
.buy{transition:transform .12s,filter .12s}
.buy:not([disabled]):hover{filter:brightness(1.08)}
.buy:not([disabled]):active{transform:translateY(2px)}
.btn2{background:var(--grain),linear-gradient(#fffaf0,#f0dab0);transition:transform .12s}
.btn2:active{transform:translateY(2px)}

/* ================= daily goals ================= */
.store{padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px}
.store-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.store-head strong{font-size:18px}
.pbar.big{height:14px;border-radius:7px}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.mat{display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(#fff,#fff8ea);border:3px solid #d8c29a;border-radius:12px;padding:8px;box-shadow:0 3px 0 #e2cfa8}
.mat svg{width:44px;height:44px}.mat b{font-family:var(--f-display);font-weight:400;font-size:22px}
.hint{margin:0;font-size:13px;color:#6d5640}
.upbox{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:#fff7e0;border:3px dashed #d8a84a;border-radius:14px;padding:10px 12px}
.upbox small{color:#6d5640}
.reqs{display:flex;flex-wrap:wrap;gap:6px}
.req{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid #e0a0a0;border-radius:10px;padding:2px 8px;font-size:13px}
.req.ok{border-color:#8cc84b;background:#f0fae6}.req svg{width:22px;height:22px}.req .coin{width:18px;height:18px;flex-basis:18px;border-width:1px}
.home-top{display:flex;gap:12px;align-items:center}.home-top>img{width:170px;height:auto;flex:0 0 170px}.home-top p{margin:4px 0 8px;font-size:14px}.home-top>div>strong{font-size:18px}
@media (max-width:640px){.home-top{flex-direction:column}}
.goals{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:118px;width:236px;z-index:5;background:var(--grain),var(--parch);border:3px solid var(--wood-d);border-radius:14px;box-shadow:0 4px 0 var(--wood-d);overflow:hidden}
.goals-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:linear-gradient(#ffe27a,#f2a21e);border-bottom:3px solid var(--wood-d);padding:6px 10px;font-family:var(--f-display);font-size:17px;letter-spacing:.5px;text-align:left}
.goals-head span{flex:1}
.goals-head i{font-style:normal;font-size:12px;font-family:var(--f-body);background:#fff;border:2px solid var(--wood-d);border-radius:10px;padding:0 7px}
.goals.closed .goals-list{display:none}.goals.closed .goals-head{border-bottom:0}
.goals-list{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.goal{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;align-items:center;font-size:12.5px;line-height:1.2}
.goal .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--wood-d);background:#fff;grid-row:span 2;display:grid;place-items:center}
.goal.done .chk{background:var(--leaf);border-color:#276b25}
.goal.done .chk::after{content:"";width:9px;height:5px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.goal .gbar{height:8px;border-radius:4px;background:#eadcc0;overflow:hidden;position:relative}
.goal .gbar b{display:block;height:100%;background:linear-gradient(90deg,#8fd04a,#3f9a3c);transition:width .4s}
.goal .gmeta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:#6d5640;grid-column:2}
.goal .claim{border:0;border-radius:8px;background:linear-gradient(#ffd23f,#f2a21e);box-shadow:0 2px 0 #9a6400;font-size:11.5px;padding:2px 9px;min-height:26px;animation:pulse 1.4s ease-in-out infinite}
.goals .bonus{border-top:2px dashed #d8c29a;padding-top:7px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:6px}

/* ================= title screen ================= */
.title{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;
  background:radial-gradient(ellipse 60% 40% at 50% 112%,#5fae36 60%,transparent 61%),radial-gradient(ellipse 70% 38% at 12% 108%,#79c43d 60%,transparent 61%),radial-gradient(ellipse 70% 38% at 90% 110%,#6cbb3b 60%,transparent 61%),radial-gradient(circle at 82% 16%,#fff7c2 0 46px,rgba(255,240,170,.5) 47px 70px,transparent 71px),linear-gradient(#7cc8f5,#bfe6ff 55%,#e8f8ff);transition:opacity .5s,transform .5s}
.title.out{opacity:0;transform:scale(1.06);pointer-events:none}
.title[hidden]{display:none}
.tlogo{display:flex;flex-direction:column;align-items:center;line-height:.86;font-family:var(--f-display);font-size:clamp(54px,11vw,118px);letter-spacing:2px;filter:drop-shadow(0 6px 0 rgba(58,35,16,.35))}
.tlogo span{display:inline-block;color:#ffd23f;-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);animation:bob 2.6s ease-in-out infinite}
.tlogo span:last-child{color:#8fe05a;animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
.tlogo .leaf{display:inline-block;width:.42em;height:.42em;margin:0 .04em;vertical-align:.1em;background:radial-gradient(circle at 30% 30%,#a8e67e,#3f9a3c);border-radius:0 65% 0 65%;border:3px solid var(--ink);transform:rotate(-20deg)}
.tstage{width:min(420px,90vw);height:170px}
.tsub{margin:0;font-size:17px;text-align:center;max-width:34ch;background:rgba(255,250,240,.88);border:3px solid var(--wood-d);border-radius:12px;padding:6px 14px}
.tplay{font-size:34px;padding:12px 56px;min-height:64px;border-radius:16px;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.title small{font-size:12px;color:#3a5a2a}
.cl{position:absolute;width:16px;height:16px;background:radial-gradient(circle at 30% 30%,#b6ec8a,#4fae3a);border-radius:0 65% 0 65%;opacity:.8;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:conf 2.6s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@media (max-width:640px){.goals{top:auto;bottom:100px;width:210px}.mbtn>em{display:none}.mbtn{margin-bottom:0}}
@media (prefers-reduced-motion:reduce){.star::before,.xpbar i::after,.sign,.badge,.tool.market,.tlogo span,.tplay,.cl,.goal .claim{animation:none}.confetti{display:none}}

@media (prefers-reduced-motion:reduce){.xpbar i{transition:none}.toast span,.sheet{animation:none}}

/* ================= barn inventory, orders, buildings, visits ================= */
.goals[hidden]{display:none}
.menu{flex-wrap:wrap;justify-content:flex-end;max-width:min(560px,calc(100vw - 24px))}
.visitbar{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:22;display:flex;align-items:center;gap:12px;background:var(--grain),var(--parch);border:3px solid var(--wood-d);border-radius:14px;box-shadow:0 4px 0 var(--wood-d);padding:8px 10px 8px 14px;max-width:calc(100% - 24px)}
.visitbar[hidden]{display:none}
.visitbar strong{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.5px}
.visitbar small{display:block;font-size:12px;color:#6d5640}
.visitbar .go{font-size:16px;padding:6px 14px;min-height:42px;white-space:nowrap}
.visitbar>div{min-width:0}.visitbar .go{flex:none}
@media (max-width:640px){.visitbar{gap:8px;padding:6px 8px 6px 12px}.visitbar strong{font-size:17px;line-height:1.05}.visitbar small{font-size:11px}.visitbar .go{font-size:14px;padding:4px 10px}}
body.visiting .tools,body.visiting .neighbors,body.visiting #goals,body.visiting .mbtn:not(#btnMusic):not(#btnSound),body.visiting .pill .plus,body.visiting .sign{display:none}
.items{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.item{border:3px solid #d8c29a;border-radius:12px;background:linear-gradient(#fff,#fff8ea);box-shadow:0 3px 0 #e2cfa8;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;position:relative}
.item img{width:56px;height:56px}
.item strong{font-size:13px;line-height:1.1}
.item small{font-size:11.5px;color:#6d5640;display:inline-flex;align-items:center;gap:3px}
.item small .coin{width:13px;height:13px;flex-basis:13px;border-width:1px}
.item .cnt{position:absolute;top:4px;right:6px;background:var(--xp);color:#fff;border-radius:9px;font-size:12px;padding:0 7px}
.item .row{display:flex;gap:4px;width:100%}
.item .row button{flex:1;min-height:34px;font-size:12px;padding:0 4px}
.barnbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.barnbar .pbar{flex:1;min-width:160px}
.barnbar .go{font-size:15px;padding:6px 14px;min-height:40px}
.pbar.full i{background:var(--danger)}
.orders{padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.order{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;border:3px solid #d8c29a;border-radius:14px;background:#fff;padding:8px 10px}
.order .nbface{width:60px;height:60px;border-radius:10px;border:2px solid var(--wood-d);display:block}
.order strong{font-size:15px}
.order .want{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.order .pay{display:flex;gap:10px;align-items:center;font-size:13px}
.order .pay .coin{width:16px;height:16px;flex-basis:16px;border-width:1px;vertical-align:-3px}
.order .acts{display:flex;flex-direction:column;gap:6px}
.order .acts .go{font-size:15px;padding:6px 14px;min-height:42px}
.order .acts .btn2{min-height:34px;font-size:13px;padding:2px 10px}
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ad{border:3px dashed #d8a84a;border-radius:12px;background:#fff7e0;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.ad strong{font-size:15px}.ad small{color:#6d5640;font-size:12px}
.ad .buy{min-height:36px}
.adon{background:#e6f5d8;border:3px solid #8cc84b;border-radius:12px;padding:8px 12px;font-size:14px}
.recipes{display:flex;flex-direction:column;gap:8px}
.recipe{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:3px solid #d8c29a;border-radius:12px;background:#fff;padding:8px 10px}
.recipe.locked{opacity:.55}
.recipe .flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.recipe .arrow{font-family:var(--f-display);font-size:20px;color:#9a6400}
.recipe .go{font-size:15px;padding:6px 14px;min-height:42px}
.recipe small{grid-column:1/-1;color:#6d5640;font-size:12px;margin-top:-4px}
.req img{width:24px;height:24px;display:block}
.mqueue{display:flex;gap:8px;flex-wrap:wrap}
.slot{width:96px;border:3px solid #d8c29a;border-radius:12px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;text-align:center}
.slot img{width:44px;height:44px}.slot.empty{border-style:dashed;color:#9c8f7c;justify-content:center;min-height:98px}
.slot.done{border-color:#8cc84b;background:#f0fae6}
.slot .pbar{width:100%}
.vmenu{display:flex;flex-direction:column;gap:8px;width:100%}
.vmenu .go,.vmenu .btn2{width:100%}
.vmenu .go{font-size:18px}
.vface .nbface{width:84px;height:84px;border-radius:14px;border:3px solid var(--wood-d);display:block}
button.chip{font:inherit;color:inherit}
.tut{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:21;display:flex;align-items:center;gap:10px;background:var(--grain),var(--parch);border:3px solid var(--wood-d);border-radius:14px;box-shadow:0 4px 0 var(--wood-d);padding:8px 8px 8px 14px;width:max-content;max-width:min(460px,calc(100% - 24px))}
.tut[hidden]{display:none}.tut>div{min-width:0}
.tut small{display:block;font-size:11px;font-weight:700;color:#9a6400;text-transform:uppercase;letter-spacing:.6px}
.tut strong{display:block;font-size:15px;line-height:1.25}
.tut .btn2{flex:none;min-height:36px;font-size:13px;padding:2px 12px}
@keyframes tutpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.95)}50%{box-shadow:0 0 0 9px rgba(255,210,63,0)}}
.tutpulse{animation:tutpulse 1.2s ease-in-out infinite;border-radius:14px}
body.visiting .tut{display:none}
.statwrap{padding:12px 14px 16px}.statwrap h3{margin:6px 0 8px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.statc{border:3px solid #d8c29a;border-radius:12px;background:#fff;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.statc b{font-family:var(--f-display);font-weight:400;font-size:22px;color:#3a2310;letter-spacing:.5px}
.statc span{font-size:12.5px;color:#6d5640}
.chip.full{background:#ffe0d8;border-color:#7a1c12}
@media (max-width:640px){.menu{gap:6px}.mbtn{width:42px;height:42px}.mbtn svg{width:26px;height:26px}.order{grid-template-columns:48px 1fr}.order .nbface{width:46px;height:46px}.order .acts{grid-column:1/-1;flex-direction:row}.order .acts>*{flex:1}.visitbar{top:auto;bottom:max(10px,env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<canvas id="farm" aria-label="Your farm. Click tiles to plow, plant and harvest."></canvas>

<header class="hud">
  <div class="lvl" title="Your level">
    <div class="star">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3l8.6 18.3 20 2.4-14.8 13.7 4 19.8L32 47.3 14.2 57.2l4-19.8L3.4 23.7l20-2.4z" fill="#ffc72c" stroke="#6b3c15" stroke-width="3.5" stroke-linejoin="round"/><path d="M32 11l5.8 12.4 13.4 1.6" fill="none" stroke="#fff3b0" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="outline" id="lvl">1</span>
    </div>
    <div class="xpbox"><div class="xpbar"><i id="xpfill" style="width:0%"></i></div><span class="xptext" id="xptext">0 / 30 XP</span></div>
  </div>
  <div class="pill" title="Coins"><span class="coin"></span><b id="coins">0</b></div>
  <div class="pill" title="Farm Cash"><span class="bill">$</span><b id="cash">0</b><button class="plus" id="cashPlus" aria-label="Spend Farm Cash in the market">+</button></div>

function glyph(px,py,kind){

  else if(kind==='wool')for(const[dx,dy]of[[-3,0],[3,0],[0,-3],[0,3],[0,0]])ell(px+dx,py+dy,3.4,3.2,'#f4f0e6','#c9c2b0',.8);
  else if(kind==='milk'){poly([[px-3,py-4],[px+3,py-4],[px+4,py+6],[px-4,py+6]],'#fff','#7a8a99',1.2);poly([[px-3,py-7],[px+3,py-7],[px+3,py-4],[px-3,py-4]],'#2d8fe3')}
  else if(kind==='truffle'){ell(px,py+1,5,4.2,'#6b4a2a');ell(px-2,py,1.2,1,'#8d6a45')}
  else if(kind==='feather'){ell(px,py,2.6,7,'#f4f6ff','#9aa6c0',1,.6);g.strokeStyle='#9aa6c0';line([px-4,py+5],[px+3,py-4])}
  else if(kind==='home'){poly([[px-6,py-1],[px,py-6.5],[px+6,py-1]],'#d9402f','#7a1c12',1);poly([[px-4.4,py-1],[px+4.4,py-1],[px+4.4,py+5.5],[px-4.4,py+5.5]],'#f6ecd6','#7a1c12',1);poly([[px-1.4,py+1.6],[px+1.4,py+1.6],[px+1.4,py+5.5],[px-1.4,py+5.5]],'#8a5a32')}
  else if(kind==='hair'){g.strokeStyle='#5e3418';g.lineWidth=1.6;for(let i=-3;i<=3;i+=1.5)line([px+i,py+5],[px+i*1.4,py-5])}
  else{ell(px-2,py+1,3.6,3.6,kind);ell(px+3,py-1,3.6,3.6,kind);ell(px-3,py,1,1,'#fff')}
}

}

function orderPool(){
  const own=new Set(),out=[];
  for(const k in S.tiles){const o=S.tiles[k];if(o.k==='animal'&&hasHome(o.id))own.add('a_'+o.id);else if(o.k==='tree')own.add('t_'+o.id);else if(o.k==='mk')own.add('mk:'+o.id)}
  for(const id in CROPS)if(CROPS[id].lvl<=S.level)out.push(id);
  for(const id of own)if(ITEMS[id])out.push(id);
  if(own.has('mk:kitchen'))for(const r of MAKERS.kitchen.recipes)if(recipeLvl(r)<=S.level&&Object.keys(r.in).every(k=>CROPS[k]||own.has(k)))out.push(r.out);
  return out;
}
function newOrder(){
  const pool=orderPool(),busy=new Set(S.orders.map(o=>o.who)),free=NEIGHBORS.filter(n=>!busy.has(n.id));

  return{id:Date.now().toString(36)+R().toString(36).slice(2,6),who:who.id,items,coins:Math.max(5,Math.round(base*mult/5)*5),xp:3+Math.round(base/60),base};
}

/* ================= visiting a neighbor's farm ================= */
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

const FARM_STYLE={hank:[.7,.2,.1,.2],mabel:[.4,.15,.15,.9],otis:[.25,.1,.65,.3],juniper:[.5,.3,.2,.5],rosa:[.3,.6,.1,.4]};
function helpedHere(id){const c=S.helped.counts;return Array.isArray(c[id])?c[id]:(c[id]=[])}
// A neighbor's farm is generated from their name and today's date, so it looks the same all day.
function genFarm(n){
  const R=rng(strHash(n.id+today())),pick=a=>a[Math.floor(R()*a.length)],now=Date.now();
  const sz=n.lvl>=20?24:n.lvl>=12?20:16,st=FARM_STYLE[n.id]||[.5,.25,.25,.4],tiles={},occ2={};
  const free=(x,y,k)=>{for(let i=0;i<k;i++)for(let j=0;j<k;j++)if(occ2[(x+i)+','+(y+j)]||x+i<0||y+j<0||x+i>=sz||y+j>=sz)return false;return true};
  const put=(x,y,o)=>{const k=size(o);if(!free(x,y,k))return false;tiles[x+','+y]=o;for(let i=0;i<k;i++)for(let j=0;j<k;j++)occ2[(x+i)+','+(y+j)]=1;return true};
  put(1,1,{k:'bld',id:'house'});put(4,1,{k:'bld',id:'barn',lv:Math.min(6,1+Math.floor(n.lvl/5))});
  const crops=Object.keys(CROPS).filter(id=>CROPS[id].lvl<=n.lvl),an=Object.keys(ANIMALS).filter(id=>ANIMALS[id].lvl<=n.lvl),tr=Object.keys(TREES).filter(id=>TREES[id].lvl<=n.lvl);
  const deco=Object.keys(DECOR).filter(id=>{const d=DECOR[id];return!d.cash&&!d.special&&d.lvl<=n.lvl&&!ROTATABLE.has(id)&&(d.sz||1)===1});
  // crop field on the left
  const fw=Math.round((sz-4)*(.45+st[0]*.3)),rows=Math.max(3,Math.round((sz-8)*st[0]*1.1)),myCrops=[pick(crops),pick(crops),pick(crops)];
  for(let y=5;y<Math.min(sz-3,5+rows);y++){const c=myCrops[Math.floor((y-5)/Math.max(1,Math.ceil(rows/3)))%3];for(let x=1;x<1+fw;x++){
    const r=R();if(r<.06){put(x,y,{k:'plot',fallow:true});continue}if(r<.1){put(x,y,{k:'plot',crop:null,t:0});continue}
    const f=R()<.35?1.05+R()*.4:.1+R()*.85;put(x,y,{k:'plot',crop:c,t:now-CROPS[c].grow*1000*f})}}
  // animals with their homes on the right, behind a fence
  const ax=Math.min(sz-6,fw+3),kinds=Math.max(1,Math.round(st[1]*4));
  for(let x=ax-1,y=4;y<sz-3;y++)put(x,y,{k:'deco',id:'fence',r:1});
  let hy=4;
  for(let i=0;i<kinds&&hy<sz-5;i++){const id=pick(an);if(!put(ax,hy,{k:'home',id,lv:1+(n.lvl>15?1:0)+(n.lvl>25?1:0)}))continue;
    const cnt=2+Math.floor(R()*3);for(let k=0;k<cnt;k++){for(let t=0;t<12;t++){const x=ax+2+Math.floor(R()*(sz-ax-3)),y=hy+Math.floor(R()*3);if(put(x,y,{k:'animal',id,fed:true,t:now-ANIMALS[id].every*1000*R()*1.4}))break}}
    hy+=4}
  // fruit trees along the bottom
  const trees=Math.round(st[2]*sz*1.2);
  for(let i=0,x=1,y=sz-2;i<trees&&y>3;i++){put(x,y,{k:'tree',id:pick(tr),t:now-1e6*R()});x+=2;if(x>=sz-1){x=2;y-=2}}
  // decorations and flowers
  for(let i=0;i<Math.round(4+st[3]*12);i++){const x=Math.floor(R()*sz),y=3+Math.floor(R()*(sz-3));if(deco.length)put(x,y,{k:'deco',id:pick(deco)})}
  for(let x=7;x<sz-1;x++)if(R()<.5)put(x,2,{k:'deco',id:deco.includes('flowers')?'flowers':pick(deco)});
  const done=helpedHere(n.id);for(const k of done)if(tiles[k])tiles[k].helped=true;
  return{tiles,size:sz};
}

/* ================= job planning ================= */
function effective(x,y){
  const k=x+','+y,pl=pend[k],last=pl&&pl[pl.length-1];
  if(last)return{pending:last};
  const key=occ[k];if(!key)return{grass:true};
  return{key,o:S.tiles[key]};
}
function planAt(x,y,kindWanted){
  const e=effective(x,y);
  if(e.pending){
    if(e.pending==='plow')return'plant';
    if(e.pending==='harvest'||e.pending==='clear')return'plow';
    return null;
  }
  if(e.grass)return'plow';
  const o=e.o;
  if(o.k==='plot'){
    if(o.fallow)return'plow';
    if(!o.crop)return'plant';
    const s=cropState(o,Date.now());
    if(s.st==='ripe')return'harvest';
    if(s.st==='withered')return'clear';
    return null;
  }
  return null;
}
function clickMulti(hx,hy){
  const key=target(hx,hy);
  if(key){
    const o=S.tiles[key],[x,y]=key.split(',').map(Number);
    if(o.k==='animal'&&!hasHome(o.id)){SFX.error();toast(plural(ANIMALS[o.id].name)+' need a '+HOMES[o.id].name+' before they can produce. Find it in Market > Homes.');return}
    if(o.k==='home'){SFX.click();showHome(key);return}
    if(o.k==='mk'){SFX.click();clickMaker(key);return}
    if(o.k==='animal'&&hungry(o)){
      if(pend[key])return;
      const need=feedNeed(o.id);if(have('feed')<need){SFX.error();toast(ANIMALS[o.id].name+' is hungry and needs '+need+' feed. Make feed at a Feed Mill or buy a Feed Sack in Market > Farm.');return}
      enqueue({kind:'feed',tiles:[[x,y]]});return;
    }
    if(o.k==='animal'||o.k==='tree'){
      if(pend[key]){return}
      const def=defOf(o),left=readyIn(o,def,Date.now());
      if(isBaby(o)){toast('Baby '+def.name.toLowerCase()+': grows up in '+fmt((o.baby-Date.now())/1000)+'.');return}
      if(left>0){toast(def.name+': '+def.product.toLowerCase()+' in '+fmt(left)+'.');return}
      if(!room()){barnFull();return}
      enqueue({kind:'collect',tiles:[[x,y]]});return;
    }
    if(o.k==='deco'){
      if(ROTATABLE.has(o.id)){if(o.id==='gate'||!wallLinks(x,y,o)){o.r=o.r?0:1;SFX.place();changed()}else toast('Connected fences and hedges line up on their own. Use Move to shift a piece.');return}
      toast(DECOR[o.id].name);return;
    }
    if(o.k==='bld'){if(o.id==='barn'){SFX.click();showBarn()}else toast('Home sweet home.');return}
    hx=x;hy=y;
  }
  const kind=planAt(hx,hy);
  if(!kind){
    const e=effective(hx,hy);
    if(e.o&&e.o.k==='plot'&&e.o.crop){const s=cropState(e.o,Date.now());
      if(s.st!=='ripe'&&s.st!=='withered'){
        if(!e.o.wet){enqueue({kind:'water',tiles:[[hx,hy]]});return}
        if(!e.o.fert&&have('fert')>queue.filter(j=>j.kind==='fertilize').length){enqueue({kind:'fertilize',tiles:[[hx,hy]]});return}
      }
      toast(s.c.name+': ready in '+fmt(s.left)+'.'+(s.st!=='ripe'&&!e.o.fert&&e.o.wet?' Fertilizer from the barn doubles the harvest.':''))}
    return;
  }
  if(kind==='harvest'&&!room()){barnFull();return}
  queueKind(kind,[[hx,hy]],null);
}
function costFor(kind){if(kind==='plow')return PLOW_COST;if(kind==='plant')return CROPS[S.seed].cost;return 0}
function queueKind(kind,tiles,vehicle){
  const c=CROPS[S.seed];
  if(kind==='plant'&&S.level<c.lvl){SFX.error();toast(c.name+' unlock at Level '+c.lvl+'.');return false}
  const cost=costFor(kind)*tiles.length;
  if(S.coins<cost){SFX.error();toast(kind==='plow'?'Plowing costs '+PLOW_COST+' coins. Sell some goods from the barn first.':'You need '+cost+' coins to plant '+c.name.toLowerCase()+'.');return false}
  S.coins-=cost;
  const job={kind,tiles,vehicle,seed:S.seed,paid:costFor(kind)};
  enqueue(job);hud();return true;
}
function fuelCost(v){return Math.max(1,vlvl(v))}
function refuel(quiet){
  fuelNow();let n=0;
  while(have('diesel')>0&&S.fuel<=FUEL_MAX-CAN_FUEL/2){takeGood('diesel',1);S.fuel=Math.min(FUEL_MAX,S.fuel+CAN_FUEL);n++}
  if(n){if(!quiet){SFX.engine();toast('Poured in '+n+' can'+(n>1?'s':'')+' of diesel. Fuel: '+S.fuel+' / '+FUEL_MAX+'.')}changed();return true}
  if(!quiet){if(S.fuel>FUEL_MAX-CAN_FUEL/2)toast('The tank is already full.');else{SFX.error();toast('No diesel in the barn. Build a Diesel Press (Market > Buildings) to make it from soybeans, sunflowers or corn.')}}
  return false;
}
function clickVehicle(hx,hy){
  const v=tool,want={tractor:'plow',seeder:'plant',harvester:'harvest'}[v],cost=fuelCost(v);
  if(fuelNow()<cost){if(have('diesel')){takeGood('diesel',1);S.fuel=Math.min(FUEL_MAX,S.fuel+CAN_FUEL);toast('Topped up the tank with a can of diesel.');SFX.engine()}else{SFX.error();toast('Out of fuel! Make diesel at a Diesel Press, buy a can in Market > Farm, or wait for the tank to trickle back.');return}}
  const area=vehicleArea(hx,hy).filter(([x,y])=>{const k=planAt(x,y);return k===want||(want==='harvest'&&k==='clear')});
  if(!area.length){toast(v==='tractor'?'Point the tractor at grass or harvested plots.':v==='seeder'?'Point the seeder at plowed plots.':'Point the harvester at ripe crops.');return}
  if(want==='harvest'){
    if(!room()){barnFull();return}
    S.fuel-=cost;enqueue({kind:'harvest',tiles:area,vehicle:v});hud();return;
  }
  if(queueKind(want,area,v)){S.fuel-=cost;hud()}
}
function finishJob(j,now){
  let xp=0,spent=0,full=false;const got={};
  for(const[x,y]of j.tiles){
    const k=x+','+y,o=S.tiles[k];
    if(j.kind==='plow'){
      if((!occ[k]||(o&&o.k==='plot'&&o.fallow))){S.tiles[k]={k:'plot',crop:null,t:0};xp+=1;stat('plow');burst(x,y,['#8b5a2e','#a87a4c'])}
      else S.coins+=j.paid;
    }else if(j.kind==='plant'){
      if(o&&o.k==='plot'&&!o.fallow&&!o.crop){o.crop=j.seed;o.t=now;if(Math.random()<.03)o.gold=true;xp+=CROPS[j.seed].xp;stat('plant');burst(x,y,['#3f9a3c','#8b5a2e'])}
      else S.coins+=j.paid;
    }else if(j.kind==='harvest'||j.kind==='clear'){
      if(o&&o.k==='plot'&&o.crop){
        const s=cropState(o,now);
        if(s.st==='ripe'){const id=o.gold?'g_'+o.crop:o.crop,n=addGood(id,o.fert&&!o.gold?2:1);
          if(n){got[id]=(got[id]||0)+n;harvested(o.crop,x,y);burst(x,y,o.gold?['#ffd23f','#fff7c0','#ffe066']:[s.c.fruit,'#ffe066']);
            if(o.gold){stat('golden');SFX.golden();floatText(x,y-1.7,'Golden '+s.c.name+'!','#ffd23f',350)}
            S.tiles[k]={k:'plot',fallow:true}}else full=true}
        else if(s.st==='withered'){toast('Those '+s.c.name.toLowerCase()+' withered. Plow and plant again.');S.tiles[k]={k:'plot',fallow:true}}
      }
    }else if(j.kind==='collect'){
      if(o&&(o.k==='animal'||o.k==='tree')){const def=defOf(o);if(readyIn(o,def,now)<=0){
        const id=(o.k==='animal'?'a_':'t_')+o.id,n=o.k==='animal'&&Math.random()<HOME_BONUS[HLV[o.id]||1]?2:1,added=addGood(id,n);
        if(added){got[id]=(got[id]||0)+added;o.t=now;if(o.k==='animal'){o.fed=false;if(Math.random()<[0,.05,.08,.12][HLV[o.id]||1])babyBorn(o.id,x,y,now)}maybeMat(x,y,.12);xp+=def.xp;stat(o.k==='animal'?'animal':'tree');burst(x,y,['#fff',def.fruit||'#ffe066']);drop(o.k==='animal'?'critters':'picnic',x,y)}else full=true;
      }}
    }else if(j.kind==='water'){
      if(o&&o.k==='plot'&&o.crop&&!o.wet){const s=cropState(o,now);if(s.st!=='ripe'&&s.st!=='withered'){o.wet=true;o.t-=s.left*300;stat('water');SFX.water();floatText(x,y-.6,'Watered! Grows faster','#bfe6ff')}}
    }else if(j.kind==='fertilize'){
      if(o&&o.k==='plot'&&o.crop&&!o.fert&&have('fert')>0){takeGood('fert',1);o.fert=true;if(!o.gold&&Math.random()<.08)o.gold=true;stat('fertilize');SFX.plant();floatText(x,y-.6,'Fertilized: double harvest','#c8f59a')}
    }else if(j.kind==='feed'){
      if(o&&hungry(o)){const need=feedNeed(o.id);if(have('feed')>=need){takeGood('feed',need);spent+=need;o.fed=true;o.t=now;stat('feed');burst(x,y,['#e8c25a','#c9a46a','#fff3b0'])}else{SFX.error();toast('Ran out of feed.')}}
    }else if(j.kind==='fert'&&VIS){
      if(o&&!o.helped){o.helped=true;helpDone(x,y)}
    }
  }
  const[cx,cy]=j.tiles[0];let line2=0;
  for(const id in got){floatText(cx,cy-line2*.55,'+'+got[id]+' '+ITEMS[id].name,'#fff3b0',line2*160);line2++}
  if(line2){SFX.harvest();setTimeout(SFX.collect,110)}
  if(full)floatText(cx,cy-line2*.55,'Barn full!','#ff9a8a');
  if(spent){floatText(cx,cy,'-'+spent+' feed','#ffe0b0');SFX.plant()}
  if(xp){floatText(cx,cy-.6-line2*.55,'+'+xp+' XP','#7cc8ff',line2?200:0);addXP(xp)}
  if(j.kind==='plow')SFX.plow();else if(j.kind==='plant')SFX.plant();else if(j.kind==='collect'&&!line2)SFX.click();
  if(j.kind==='plow'&&xp)floatText(cx,cy,'-'+j.paid*j.tiles.length,'#ffb3a8');
  changed();
}
// Happy animals sometimes have a baby: it appears next to its parent if their home has room, and grows up over a few cycles.
function babyBorn(id,x,y,now){
  buildOcc();if((ANC[id]||0)>=homeCap(id))return;
  for(let r=1;r<=2;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const bx=x+dx,by=y+dy,k=bx+','+by;if(!inGrid(bx,by)||occ[k]||pend[k])continue;
    const grow=Math.max(180,ANIMALS[id].every*3);S.tiles[k]={k:'animal',id,t:now,fed:true,baby:now+grow*1000};occ[k]=k;ANC[id]=(ANC[id]||0)+1;
    stat('baby');setTimeout(()=>{SFX.baby();floatText(bx,by-1,'♥ Baby '+ANIMALS[id].name.toLowerCase()+'!','#ffb3d0');burst(bx,by,['#ffb3d0','#fff','#ffd23f']);toast('A baby '+ANIMALS[id].name.toLowerCase()+' was born! It grows up in '+fmt(grow)+'.')},400);
    return;
  }
}
function harvested(id,x,y){
  stat('harvest');
  S.mastery[id]=(S.mastery[id]||0)+1;
  const ml=S.mlvl[id]||0;
  if(ml<3&&S.mastery[id]>=MASTERY[ml]){
    S.mlvl[id]=ml+1;const c=CROPS[id];
    const rw=[[100,15,0],[250,30,0],[500,60,1]][ml];
    S.coins+=rw[0];S.cash+=rw[2];
    setTimeout(()=>{addXP(rw[1]);SFX.ribbon();toast('Mastery star '+(ml+1)+' for '+c.name+'! +'+rw[0]+' coins'+(rw[2]?' and 1 Farm Cash':'')+'.');stat('mastery')},400);
  }
  drop('garden',x,y);maybeMat(x,y,.07);
}
function drop(collId,x,y){
  if(Math.random()>.12)return;
  const c=COLLECTIONS.find(c=>c.id===collId),it=c.items[Math.floor(Math.random()*c.items.length)];
  S.coll[it]=(S.coll[it]||0)+1;
  setTimeout(()=>{SFX.find();floatText(x,y-1.2,CITEM[it]+'!','#ffb3ff');toast('You found a '+CITEM[it]+' for your '+c.name+' collection!');hud()},350);
}

function place(x,y){
  const p=placing;

  if(p.move){S.tiles[x+','+y]=p.ghost;placing=null;$('rotBtn').hidden=true;SFX.place();changed();return}
  if(p.ghost.k==='animal'){const id=p.ghost.id;
    if(!hasHome(id)){SFX.error();toast('Build a '+HOMES[id].name+' first. Find it in Market > Homes.');placing=null;return}
    if((ANC[id]||0)>=homeCap(id)){SFX.error();toast('Your '+HOMES[id].name+(HC[id]>1?'s are':' is')+' full. Build another one for more room.');placing=null;return}}
  if(p.fromInv){
    const k=p.cat+':'+p.id;S.inv[k]--;if(!S.inv[k])delete S.inv[k];
  }else if(p.def.cash){if(S.cash<p.def.cash){SFX.error();toast('Not enough Farm Cash.');placing=null;return}S.cash-=p.def.cash}
  else{if(S.coins<p.def.cost){SFX.error();toast('You need '+p.def.cost+' coins for this.');placing=null;return}S.coins-=p.def.cost;floatText(x,y,'-'+p.def.cost,'#ffb3a8')}
  const o=Object.assign({},p.ghost);if(o.k==='animal'||o.k==='tree')o.t=Date.now();if(!ROTATABLE.has(o.id))delete o.r;
  S.tiles[x+','+y]=o;burst(x,y,['#fff','#ffe066','#79c43d']);SFX.place();stat('decor');
  const xp=p.def.buyxp||p.def.xp||0;if(xp){floatText(x,y-.6,'+'+xp+' XP','#7cc8ff',180);addXP(xp)}
  changed();
  const again=p.fromInv?(S.inv[p.cat+':'+p.id]||0)>0:p.def.cash?S.cash>=p.def.cash:S.coins>=p.def.cost;
  if(!(again&&(o.k==='deco'||p.fromInv))){placing=null;$('rotBtn').hidden=true}
}

function act(hx,hy){
  if(placing){place(hx,hy);return}
  if(!inGrid(hx,hy))return;
  if(VIS){actVisit(hx,hy);return}
  if(tool==='delete'){
    const key=target(hx,hy);if(!key)return;const o=S.tiles[key];
    if(o.k==='bld'){toast('The farmhouse and barn stay. Use Move to shift them.');return}
    if(pend[key]){toast('The farmer is still working there.');return}
    if(o.k==='mk'&&o.q&&o.q.length){SFX.error();toast('Collect or finish the jobs in this '+MAKERS[o.id].name+' first.');return}
    delete S.tiles[key];const[x,y]=key.split(',').map(Number);burst(x,y,['#8b5a2e','#79c43d']);SFX.click();changed();return;
  }
  if(tool==='move'){
    const key=target(hx,hy);if(!key)return;const o=S.tiles[key];
    if(pend[key]){toast('Wait for the farmer to finish there.');return}
    delete S.tiles[key];buildOcc();
    const def=defOf(o);startPlacing({move:key,ghost:o,name:o.k==='bld'?(o.id==='house'?'Farmhouse':'Barn'):o.k==='plot'?'Plot':def.name});return;
  }
  if(VEH[tool]){clickVehicle(hx,hy);return}

}

  const a=ac();if(a&&a.state==='suspended')a.resume();
  cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1)down={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};
  else{down=null;const[p1,p2]=[...pointers.values()];pinch={d:Math.hypot(p1.x-p2.x,p1.y-p2.y)||1,z:cam.z,mx:(p1.x+p2.x)/2,my:(p1.y+p2.y)/2}}

  if(!inGrid(hx,hy))return'';

  const key=target(hx,hy),now=Date.now();

  if(o.k==='deco')return DECOR[o.id].name;
  return o.id==='house'?'Farmhouse':'Barn';
}

const ICONS={};let ICON_MODE=false;
function renderIcon(cat,id,lv){
  const c=document.createElement('canvas');c.width=240;c.height=200;
  const prev=g;g=c.getContext('2d');const now=Date.now();ICON_MODE=true;
  const tall=cat==='trees'||(cat==='decor'&&['windmill','silo','balloon','scarecrow','lamp','arbor'].includes(id));
  const big=(cat==='decor'&&DECOR[id].size===2)||cat==='homes'||cat==='buildings';
  const sc=big?1.25:tall?1.6:2.2;g.setTransform(sc,0,0,sc,120,big?70:tall?122:96);
  if(cat==='farm'){g.setTransform(2,0,0,2,120,96);poly(quad(0,0),'#7cc63e','#5d9a2c',1);drawFarmIcon(id,now)}
  else{
    poly(big?[P(0,0),P(2,0),P(2,2),P(0,2)]:quad(0,0),'#7cc63e','#5d9a2c',1);
    if(cat==='seeds'){drawSoil(0,0,false);drawCrop(0,0,{k:'plot',crop:id,t:now-CROPS[id].grow*1000-1000},now)}
    else if(cat==='animals')drawObj(0,0,{k:'animal',id,t:now-1e9},now);
    else if(cat==='trees')drawObj(0,0,{k:'tree',id,t:now-1e9},now);
    else if(cat==='homes')drawHome(0,0,id,lv||1);
    else if(cat==='buildings')drawMaker(0,0,id);
    else drawObj(0,0,{k:'deco',id},now);
  }
  g=prev;ICON_MODE=false;return c.toDataURL();
}
function drawFarmIcon(id,now){
  const[px,py]=P(.5,.5);
  if(FARM[id].kind==='vehicle'){g.save();g.translate(px+3,py+2);g.scale(.9,.9);drawVehicle(id,now,false,false);g.restore();return}
  if(FARM[id].kind==='supply'){drawGood(FARM[id].item,px,py-12,2.1);return}
  if(FARM[id].kind==='pet'){g.save();g.translate(px-4,py+4);g.scale(2,2);drawPet(FARM[id].pet,{sit:true,happy:true},now);g.restore();return}
  if(FARM[id].kind==='expand'){
    poly(quad(0,0,.1),'#8fd44a','#3f7a24',1.5);g.fillStyle='#fff';g.strokeStyle='#3a2310';g.lineWidth=3;g.font='16px "Luckiest Guy", Impact';g.textAlign='center';
    const t=FARM[id].to+'x'+FARM[id].to;g.strokeText(t,px,py+5);g.fillText(t,px,py+5);return;
  }
  const k=FARM[id].kind;
  if(k==='fuel'){poly([[px-9,py-2],[px+9,py-2],[px+9,py-26],[px-4,py-26],[px-9,py-21]],'#d9402f','#7a1c12',1.4);poly([[px+3,py-30],[px+8,py-30],[px+8,py-26],[px+3,py-26]],'#3a3a3a');g.strokeStyle='#fff';g.lineWidth=2;line([px-5,py-8],[px+5,py-20]);line([px+5,py-8],[px-5,py-20])}
  else if(k==='grow'){ell(px,py-4,10,4,'#8b5a2e');g.strokeStyle='#3f9a3c';g.lineWidth=2;line([px,py-4],[px,py-20]);leaf(px-5,py-16,6,3,-.5,'#4fae3a');leaf(px+5,py-20,6,3,.5,'#3f9a3c');sparkle(px+10,py-26,6,1);sparkle(px-11,py-22,4,1)}
  else{
    const sv=farmer.job;farmer.job={kind:k==='feed'?'collect':'harvest'};
    const sx=farmer.x,sy=farmer.y,st=farmer.state;farmer.x=.55;farmer.y=.55;farmer.state='work';farmer.t=0;farmer.dir=1;
    drawFarmer(now);farmer.job=sv;farmer.x=sx;farmer.y=sy;farmer.state=st;
    if(k==='arborist')ell(px+12,py-26,3.4,3.4,'#e0352b');if(k==='feed')poly([[px-15,py-2],[px-6,py-2],[px-7,py-14],[px-14,py-14]],'#e8d5a8','#a8895a',1);
  }
}

function buyItem(cat,id,d){
  SFX.click();
  if(cat==='seeds'){S.seed=id;setTool('multi');closeModal();toast(d.name+' selected. Click plowed plots to plant them.');changed();return}
  if(d.cash&&S.cash<d.cash){SFX.error();toast('You need '+d.cash+' Farm Cash. You earn 1 every level up and from the daily bonus.');return}
  if(!d.cash&&S.coins<d.cost){SFX.error();toast('You need '+d.cost.toLocaleString()+' coins for the '+d.name.toLowerCase()+'.');return}
  if(cat==='farm'){
    if(d.kind==='supply'&&room()<d.n){barnFull();return}
    if(d.cash)S.cash-=d.cash;else S.coins-=d.cost;
    const now=Date.now();let n=0;
    if(d.kind==='pet'){const had=S.pet;S.pet={kind:d.pet,name:PET_NAME[d.pet]};placePet();d.pet==='dog'?SFX.bark():SFX.meow();closeModal();toast((had?'Swapped pets! ':'')+'Meet '+S.pet.name+', your new '+(d.pet==='dog'?'farm dog':'barn cat')+'! Rename it in the Wardrobe.');changed();return}
    if(d.kind==='vehicle'){S.veh[id]=true;toast('Your new '+d.name.toLowerCase()+' is ready! Pick it from the tools.');SFX.engine()}
    else if(d.kind==='expand'){S.size=d.to;N=S.size;buildBorder();fit();toast('Your farm grew to '+d.to+' by '+d.to+'!');SFX.level()}
    else if(d.kind==='fuel'){S.fuel=FUEL_MAX;S.fuelT=now;toast('Fuel tank full.')}
    else if(d.kind==='supply'){addGood(d.item,d.n);SFX.coin();toast(d.n+' '+ITEMS[d.item].name.toLowerCase()+' added to your barn.')}
    else if(d.kind==='grow'){for(const k in S.tiles){const o=S.tiles[k];if(o.k==='plot'&&o.crop){const s=cropState(o,now);if(s.st!=='ripe'&&s.st!=='withered'){o.t=now-CROPS[o.crop].grow*1000;n++}}}toast(n?n+' plots are ready to harvest!':'Nothing was growing. Your Farm Cash was refunded.');if(!n)S.cash+=d.cash;else SFX.find()}
    else{
      let xp=0,full=false;const got={};
      for(const k in S.tiles){
        if(pend[k]||full)continue;
        const o=S.tiles[k],[x,y]=k.split(',').map(Number);
        if(d.kind==='farmhand'&&o.k==='plot'&&o.crop){const s=cropState(o,now);if(s.st==='ripe'){if(!addGood(o.crop,1)){full=true;continue}got[o.crop]=(got[o.crop]||0)+1;n++;harvested(o.crop,x,y);S.tiles[k]={k:'plot',fallow:true};burst(x,y,[s.c.fruit])}}
        if((d.kind==='arborist'&&o.k==='tree')||(d.kind==='feed'&&o.k==='animal'&&hasHome(o.id)&&!hungry(o))){const def=defOf(o);if(readyIn(o,def,now)<=0){const id=(o.k==='animal'?'a_':'t_')+o.id;if(!addGood(id,1)){full=true;continue}got[id]=(got[id]||0)+1;o.t=now;if(o.k==='animal')o.fed=false;xp+=def.xp;n++;stat(o.k==='animal'?'animal':'tree');burst(x,y,['#fff',def.fruit||'#ffe066'])}}
      }
      if(!n){S.cash+=d.cash;toast(full?'Your barn is full. Your Farm Cash was refunded.':'Nothing was ready. Your Farm Cash was refunded.')}
      else{toast(d.name+' brought in '+n+' goods'+(full?' until the barn filled up':'')+'. They are in your barn.');SFX.harvest();if(xp)addXP(xp)}
    }
    changed();rerender();return;
  }
  const kind=cat==='animals'?'animal':cat==='trees'?'tree':cat==='homes'?'home':cat==='buildings'?'mk':'deco';
  closeModal();setTool('multi');
  startPlacing({cat:kind,id,def:d,name:d.name,ghost:kind==='mk'?{k:'mk',id,q:[]}:{k:kind,id,t:Date.now()}});
}

const PORTRAITS={};
function avatar(n){

  if(!PORTRAITS[n.id]){
    const c=document.createElement('canvas');c.width=c.height=138;const prev=g;g=c.getContext('2d');
    g.fillStyle='#bfe6ff';g.fillRect(0,0,138,138);g.fillStyle='#9fd27a';g.fillRect(0,104,138,34);
    g.setTransform(3.4,0,0,3.4,69,166);drawAvatar(n.look,{});g=prev;PORTRAITS[n.id]=c.toDataURL();
  }
  return'<img class="nbface" src="'+PORTRAITS[n.id]+'" alt="">';
}
function giftFor(){
  const pool=[];
  for(const id in TREES)if(TREES[id].lvl<=S.level)pool.push(['tree',id,3]);
  for(const id in ANIMALS)if(ANIMALS[id].lvl<=S.level)pool.push(['animal',id,2]);
  for(const id in DECOR){const d=DECOR[id];if(!d.cash&&!d.special&&d.lvl<=S.level)pool.push(['deco',id,2])}
  let tot=pool.reduce((a,p)=>a+p[2],0),r=Math.random()*tot;
  for(const p of pool){r-=p[2];if(r<=0)return p}
  return pool[0];
}

function owns(group,val){return!priceOf(group,val)||S.owned.includes(group+':'+val)}
function lookCost(L){
  const out={coins:0,cash:0,keys:[],names:[]};
  for(const grp of['hat','top','bottom','acc']){
    const p=priceOf(grp,L[grp]);if(!p||owns(grp,L[grp]))continue;
    out.coins+=p.coins||0;out.cash+=p.cash||0;out.keys.push(grp+':'+L[grp]);
    out.names.push(LOOK_OPTS[grp].find(x=>x[0]===L[grp])[1]);
  }
  return out;
}

  if(!S||!S.pet)return;

  const tx=farmer.x-.55,ty=farmer.y+.55,dx=tx-pet.x,dy=ty-pet.y,d=Math.hypot(dx,dy);

/* ================= day and night ================= */
// One day on the farm lasts 16 minutes: a long day, a golden dusk, a short starry night and a dawn.
const DAY_LEN=960;
function dayPhase(){return(Date.now()/1000%DAY_LEN)/DAY_LEN}
function darkness(){const p=dayPhase();if(p<.62)return 0;if(p<.72)return(p-.62)/.1;if(p<.9)return 1;return 1-(p-.9)/.1}
const fireflies=[];for(let i=0;i<22;i++)fireflies.push({x:Math.random()*16,y:Math.random()*16,a:Math.random()*6,p:Math.random()*20});
let NIGHT=null,wasNight=false;
function nightLights(){
  const out=[];
  for(const k in S.tiles){const o=S.tiles[k],[x,y]=k.split(',').map(Number);
    if(o.k==='bld')out.push([...P(x+1,y+1.2,o.id==='house'?16:12),o.id==='house'?95:60]);
    else if(o.k==='home')out.push([...P(x+1,y+1,10),55]);
    else if(o.k==='mk')out.push([...P(x+1,y+1.1,12),70]);
    else if(o.k==='deco'&&(o.id==='lamp'||o.id==='lantern'))out.push([...P(x+.5,y+.5,30),85]);}
  out.push([...P(farmer.x,farmer.y,16),48]);
  return out;
}
function drawNight(now){
  const d=darkness(),night=d>.6;
  if(night&&!wasNight&&!VIS)toast('Night falls over '+S.farmName+'. Fireflies are out!');wasNight=night;
  if(d<=.01)return;
  if(!NIGHT||NIGHT.width!==cv.width||NIGHT.height!==cv.height){NIGHT=document.createElement('canvas');NIGHT.width=cv.width;NIGHT.height=cv.height}
  const x=NIGHT.getContext('2d'),w=NIGHT.width,h=NIGHT.height,L=nightLights(),sc=s=>s*cam.z*dpr;
  x.globalCompositeOperation='source-over';x.clearRect(0,0,w,h);

  x.fillStyle='rgba('+Math.round(18+40*dusk)+','+Math.round(26+10*dusk)+','+Math.round(70-20*dusk)+','+(.52*d).toFixed(3)+')';x.fillRect(0,0,w,h);
  x.globalCompositeOperation='destination-out';
  for(const[wx,wy,r]of L){const sx=(wx*cam.z+cam.x)*dpr,sy=(wy*cam.z+cam.y)*dpr,R=sc(r),gr=x.createRadialGradient(sx,sy,0,sx,sy,R);gr.addColorStop(0,'rgba(0,0,0,.8)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(sx-R,sy-R,R*2,R*2)}
  g.setTransform(1,0,0,1,0,0);g.drawImage(NIGHT,0,0);
  g.globalCompositeOperation='lighter';
  for(const[wx,wy,r]of L){const sx=(wx*cam.z+cam.x)*dpr,sy=(wy*cam.z+cam.y)*dpr,R=sc(r*.55),gr=g.createRadialGradient(sx,sy,0,sx,sy,R);gr.addColorStop(0,'rgba(255,180,80,'+(.28*d).toFixed(3)+')');gr.addColorStop(1,'rgba(255,180,80,0)');g.fillStyle=gr;g.fillRect(sx-R,sy-R,R*2,R*2)}
  for(const f of fireflies){const b=reduce?.8:(Math.sin(now/260+f.p)+1)/2;if(b<.35)continue;const[wx,wy]=P(f.x,f.y,18+Math.sin(now/700+f.p)*8),sx=(wx*cam.z+cam.x)*dpr,sy=(wy*cam.z+cam.y)*dpr,R=sc(7);
    const gr=g.createRadialGradient(sx,sy,0,sx,sy,R);gr.addColorStop(0,'rgba(230,255,140,'+(.9*d*b).toFixed(3)+')');gr.addColorStop(.25,'rgba(200,255,90,'+(.45*d*b).toFixed(3)+')');gr.addColorStop(1,'rgba(200,255,90,0)');g.fillStyle=gr;g.fillRect(sx-R,sy-R,R*2,R*2)}
  g.globalCompositeOperation='source-over';
}
function updateFireflies(dt){if(reduce||darkness()<.2)return;for(const f of fireflies){f.a+=(Math.random()-.5)*dt*3;f.x+=Math.cos(f.a)*dt*.5;f.y+=Math.sin(f.a)*dt*.5;if(f.x<0||f.y<0||f.x>N||f.y>N){f.x=Math.random()*N;f.y=Math.random()*N}}}

function drawTutArrow(now){
  if(!tutOn())return;const t=TUT[S.tut];if(!t.find)return;
  let best=null;for(const k in S.tiles){if(pend[k])continue;const o=S.tiles[k];if(t.find(o)){const[x,y]=k.split(',').map(Number);if(!best||x+y<best[0]+best[1])best=[x,y]}}
  if(!best)return;const[px,py]=P(best[0]+.5,best[1]+.5),b=reduce?0:Math.abs(Math.sin(now/260))*-8,y0=py-44+b;
  poly([[px-7,y0-16],[px+7,y0-16],[px+7,y0-4],[px+13,y0-4],[px,y0+9],[px-13,y0-4],[px-7,y0-4]],'#ffd23f','#6b3c15',2);
}

/* ================= farm stats ================= */
const STAT_LIST=[['harvest','Crops harvested'],['plant','Seeds planted'],['plow','Plots plowed'],['water','Crops watered'],['golden','Golden crops'],['animal','Animal goods collected'],['feed','Animals fed'],['baby','Babies born'],['tree','Fruit picked'],['make','Goods made'],['sell','Goods sold at market'],['order','Orders filled'],['earned','Coins earned from sales'],['help','Neighbors helped'],['visit','Visitors greeted'],['petfind','Things your pet found']];
function renderStats(b){
  const now=Date.now(),days=Math.max(1,Math.ceil((now-S.born)/864e5)),cnt={plot:0,animal:0,tree:0,mk:0,deco:0,home:0};
  for(const k in S.tiles){const o=S.tiles[k];if(cnt[o.k]!==undefined)cnt[o.k]++}
  const p=el('div','statwrap'),farm=el('div','statgrid');
  for(const[n,l]of[[S.level,'Farm level'],[days,days>1?'Days farming':'Day farming'],[cnt.plot,'Plots'],[cnt.animal,'Animals'],[cnt.tree,'Fruit trees'],[cnt.mk,'Buildings'],[storeTotal()+' / '+barnCap(),'In the barn'],[S.pet?(S.pet.name||PET_NAME[S.pet.kind]):'None yet','Pet']])
    {const c=el('div','statc');c.appendChild(el('b',null,typeof n==='number'?n.toLocaleString():n));c.appendChild(el('span',null,l));farm.appendChild(c)}
  p.appendChild(el('h3',null,S.farmName));p.appendChild(farm);
  const life=el('div','statgrid');
  for(const[k,l]of STAT_LIST){const c=el('div','statc');c.appendChild(el('b',null,st(k).toLocaleString()));c.appendChild(el('span',null,l));life.appendChild(c)}
  p.appendChild(el('h3',null,'All-time'));p.appendChild(life);
  const top=Object.keys(S.mastery).sort((a,b)=>S.mastery[b]-S.mastery[a]).slice(0,3).filter(k=>CROPS[k]);
  if(top.length)p.appendChild(el('p','hint','Favorite crops: '+top.map(k=>CROPS[k].name+' ('+S.mastery[k]+')').join(', ')+'.'));
  b.appendChild(p);
}

/* ================= daily bonus ================= */
function dailyBonus(){
  const t=today();if(S.daily.last===t)return;
  const streak=S.daily.last===yesterday()?Math.min(5,S.daily.streak+1):1;
  modal({title:'Daily Bonus',color:'green',small:true,noClose:true,render(b){
    const p=el('div','body-pad');p.appendChild(el('p',null,'Welcome back to Clover Hollow! Come back every day for bigger rewards.'));
    const days=el('div','days');
    DAILY.forEach((r,i)=>{const d=el('div','day'+(i+1<streak?' done':i+1===streak?' today':''));d.appendChild(el('b',null,'Day '+(i+1)));
      d.appendChild(el('span',null,r.coins+' coins'));if(r.fuel)d.appendChild(el('span',null,'+'+r.fuel+' fuel'));if(r.cash)d.appendChild(el('span',null,'+'+r.cash+' Farm Cash'));days.appendChild(d)});
    p.appendChild(days);
    const go=el('button','go','Collect');go.dataset.focus='1';
    go.onclick=()=>{
      const r=DAILY[streak-1];S.daily={last:t,streak};S.coins+=r.coins;if(r.cash)S.cash+=r.cash;
      if(r.fuel){fuelNow();S.fuel=Math.min(FUEL_MAX,S.fuel+r.fuel)}
      SFX.coin();toast('Daily bonus: +'+r.coins+' coins'+(r.cash?' and '+r.cash+' Farm Cash':'')+'!');changed();closeModal();
    };
    p.appendChild(go);b.appendChild(p);
  }});
}

/* ================= boot ================= */
function start(data){
  S=norm(valid(data&&data.S)?data.S:(load()||fresh()));
  N=S.size;
  for(const k in S.tiles){const o=S.tiles[k];if(o.k==='bld'){farmer.x=+k.split(',')[0]+2.4;farmer.y=+k.split(',')[1]+2.6;break}}
  resize();buildBorder();buildOcc();buildBars();renderNeighbors();hud();save();placePet();
  window.claude?.hot?.snapshot?.(()=>({S}));
  requestAnimationFrame(frame);
  setInterval(save,10000);
  const first=!S.tips.welcome;S.tips.welcome=true;
  if(S.tips.homeGift===false){S.tips.homeGift=true;setTimeout(()=>toast('Animals now live in homes! Free homes for your animals are waiting in your Gift Box.'),1500)}
  else if(!S.tips.homes&&Object.values(S.tiles).some(o=>o.k==='animal'&&!hasHome(o.id))){S.tips.homes=true;setTimeout(()=>toast('Your chickens and sheep need homes! Buy a Chicken Coop and a Sheep Pen in Market > Homes.'),3200)}
  if(first)toast('Welcome to Clover Hollow! Click the sparkling strawberries and your farmer will harvest them.');
  if(!S.tips.avatar)showWardrobe(true);
  dailyBonus();
  renderGoals();setInterval(()=>{if(S.goals&&S.goals.day!==today())renderGoals()},60000);
  tickOrders();
  showTitle();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
