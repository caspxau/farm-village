@keyframes v4fade{from{opacity:0}}
.mdet-card h3{margin:0;font-family:'Fredoka',var(--f-body);font-size:24px;font-weight:700;color:#3a2310}
.mdet-card img{width:190px;height:160px;object-fit:contain}
.mdet-x{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:2px solid #5a140c;color:#fff;font:800 18px/1 var(--f-body);background:radial-gradient(circle at 35% 28%,#ff9a82,#dc4430 52%,#9a2618);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 #5a140c}
.mdet-card dl{display:grid;grid-template-columns:1fr auto;gap:6px 14px;width:100%;margin:0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.6);border:1px solid #e2cfa8;font-size:14px}
.mdet-card dt{color:#6d5640;font-weight:700}.mdet-card dd{margin:0;font-weight:800;color:#3a2310;text-align:right;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.mdet-card dd .coin{width:15px;height:15px;flex-basis:15px;border-width:1px}
.mqty{display:flex;gap:6px;width:100%}.mqty button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid #c9a46a;background:#fffaf0;font-weight:800;color:#5a3f24}
.mqty button[aria-pressed="true"]{background:linear-gradient(#ffe7a0,#f2c14e);border-color:#a8781e;color:#3a2310;box-shadow:0 2px 0 #a8781e}
.mdet-card .mbuy{width:100%;font-size:16px;min-height:48px}
.flycoin{position:fixed;z-index:200;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc72c 45%,#d99500);border:2px solid #9a6400;box-shadow:0 2px 4px rgba(0,0,0,.3)}
@media (max-width:640px){.sheet-head.market h2{font-size:25px;padding:3px 22px 5px}.sheet.market .mgrid{grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px;padding:10px 10px 18px}}
@media (max-width:360px){.sheet.market .mgrid{grid-template-columns:1fr 1fr;gap:8px;padding:10px 8px 16px}.sheet.market .mart img{width:118px;height:98px}.mart{height:100px}.sheet.market .mtab{min-width:60px}}
.dock .tutpulse{animation:tutpulse 1.2s ease-in-out infinite!important}
@media (max-width:640px){.sheet,.sheet.small,.sheet.wide{border-radius:22px 22px 0 0}}
@media (max-height:520px) and (orientation:landscape){.sheet,.sheet.small,.sheet.wide{border-radius:16px}}


.needpill .nhead{display:flex;align-items:center;gap:6px;margin:-1px 0 1px}
.needpill .nhead img{width:24px;height:24px;border-radius:50%;background:#cfe8ff;border:1.5px solid rgba(90,63,36,.5);object-fit:cover;flex:none}
.needpill .nhead span{display:flex;flex-direction:column;line-height:1.05;text-align:left;min-width:0}
.needpill .nhead b{font-size:12px;font-weight:800;color:#3a2310;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.needpill .nhead small{font-size:9.5px;font-weight:700;color:#7a5a3a;white-space:nowrap}
@media (max-width:640px){.needpill .nhead small{display:none}.needpill .nhead img{width:20px;height:20px}}
/* needs card: icon badges, thick bars with a value, colors that follow the level, a mood line and the Fresh badge */
.needpill [hidden]{display:none!important}
.needpill{min-width:150px;gap:4px;padding:6px 9px 7px}
.needpill .nface{position:relative;flex:none;display:block}
.needpill .nhead img{width:30px;height:30px;box-shadow:0 1px 3px rgba(60,40,20,.25)}
.needpill .nmood{position:absolute;right:-5px;bottom:-4px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;line-height:1;color:#fff;background:#d9402f;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.needpill .nmood.drink{background:#2d8fe3}
.needpill .nhead small{font-size:10px;max-width:104px;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.needpill .nhead small.warn{color:#b8571a}.needpill .nhead small.bad{color:#c0392b}
.needpill .nfresh{margin-left:auto;align-self:flex-start;font-size:9.5px;font-weight:800;color:#fff;background:linear-gradient(#5fc0f0,#2d8fe3);border-radius:8px;padding:2px 5px;box-shadow:0 1px 0 #1f5f9a;white-space:nowrap}
.needpill .nrow{gap:6px}
.needpill .nico{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.2)}
.needpill .nico svg{width:11px;height:11px}
.needpill .nico.food{background:linear-gradient(#f6a14a,#e07b1f)}.needpill .nico.drink{background:linear-gradient(#5fc0f0,#2d8fe3)}
.needpill em{height:10px!important;border-radius:6px!important;background:rgba(90,62,32,.16)!important;border:0!important;box-shadow:inset 0 1px 2px rgba(60,40,20,.25);position:relative}
.needpill em i{border-radius:6px;position:relative;transition:width .6s cubic-bezier(.3,1.3,.5,1),background .4s}
.needpill em i::after{content:'';position:absolute;inset:1px 3px auto 3px;height:3px;border-radius:3px;background:rgba(255,255,255,.45)}
.needpill em i.ok{background:linear-gradient(90deg,#7cc35a,#4e9a3a)!important}
.needpill .nrow:last-child em i.ok{background:linear-gradient(90deg,#7cc4f2,#3d86c8)!important}
.needpill em i.mid{background:linear-gradient(90deg,#f6c64a,#e39a1f)!important}
.needpill em i.low{background:linear-gradient(90deg,#f58a6a,#d9402f)!important}
.needpill em i.fill{animation:needfill 1s ease-out}
@keyframes needfill{0%{filter:brightness(1.6) saturate(1.3)}100%{filter:none}}
.needpill .nval{min-width:22px;text-align:right;font-size:11px;font-weight:800;color:#5a3f24;font-variant-numeric:tabular-nums}
.needpill.low{animation:needwarn 1.6s ease-in-out infinite}
@keyframes needwarn{0%,100%{box-shadow:var(--sh-2)}50%{box-shadow:0 0 0 3px rgba(217,64,47,.45),var(--sh-2)}}
@media (max-width:640px){.needpill{min-width:118px;padding:4px 7px 5px}.needpill .nhead img{width:24px;height:24px}.needpill .nfresh{display:none}}
@media (max-height:520px) and (orientation:landscape){.needpill{min-width:112px}.needpill .nhead small{display:none}}
@media (prefers-reduced-motion:reduce){.needpill.low,.needpill em i.fill{animation:none}}
.v5anims{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:12px 0 6px}
.v5anim{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px 9px;min-height:44px;border-radius:12px;border:1.5px solid rgba(120,90,50,.3);background:linear-gradient(#fffdf6,#f4ead6);font:inherit;color:#3a2310;cursor:pointer;overflow:hidden}
.v5anim img{width:64px;height:48px;object-fit:cover;object-position:50% 58%;margin:-4px 0 -2px}
.v5anim b{font-size:12px;font-weight:800}.v5anim small{font-size:11px;font-weight:700;color:#7a5a3a}
.v5anim small.rdy{color:#2f8a2a}.v5anim small.hun{color:#c0392b}
.v5anim i{position:absolute;left:8px;right:8px;bottom:4px;height:4px;border-radius:2px;background:#e6d8bd}
.v5anim i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--k);border-radius:2px;background:linear-gradient(90deg,#9be06a,#3f9a3c)}
.v5anim:active{transform:scale(.96)}
/* ---- v5: living farm ---- */
.flyitem{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:210;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));will-change:transform}
.sweepcur{position:fixed;left:0;top:0;width:46px;height:46px;z-index:205;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));will-change:transform}

span.coin{background:var(--ico-coin) center/contain no-repeat!important;border:0!important;border-radius:0!important;box-shadow:none!important;filter:drop-shadow(0 1px 1px rgba(60,30,0,.25))}
span.bill{background:var(--ico-bill) center/contain no-repeat!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:transparent!important;text-shadow:none!important;overflow:hidden;filter:drop-shadow(0 1px 1px rgba(20,50,20,.25))}
.hud span.coin{width:32px!important;height:32px!important;flex-basis:32px!important}
.hud span.bill{width:38px!important;height:26px!important;flex-basis:38px!important}
.hud .pill{background:linear-gradient(rgba(74,52,30,.82),rgba(52,36,20,.86))!important;border:1px solid rgba(255,232,190,.28)!important;box-shadow:inset 0 1px 0 rgba(255,240,210,.22),0 3px 8px rgba(0,0,0,.28)!important}
.hud .pill b{color:#fff8e8;text-shadow:0 1px 0 rgba(0,0,0,.45);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.hud .xpbox{background:linear-gradient(rgba(74,52,30,.82),rgba(52,36,20,.86))!important;border:1px solid rgba(255,232,190,.28)!important}
.hud .xplabel{color:#f6e6c6!important}.hud .xplabel b{color:#ffd54a!important}
.hud .xpbar{background:rgba(0,0,0,.38)!important;border:0!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.45)!important;height:15px!important}
.hud .xpbar i{background:linear-gradient(#ffe27a,#f2b51e 55%,#c9850c)!important;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.hud .xptext{color:#fff!important;text-shadow:0 1px 1px rgba(0,0,0,.7)!important;font-variant-numeric:tabular-nums}
.hud .star svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.hud .star span{color:#fff;text-shadow:0 1.5px 0 #7a4806,0 0 4px rgba(122,72,6,.6)}
.fuelpill .fuelico{width:22px;height:22px;flex:none}
.fuelpill .fuelbar{background:rgba(0,0,0,.38)!important;border:0!important;height:8px!important;border-radius:5px!important;overflow:hidden}
.fuelpill .fuelbar i{border-radius:5px}
.hud .plus{background:linear-gradient(#8fd07e,#3f8f46)!important;border:1px solid #1f5a28!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.35)!important;color:#fff!important}
.mat svg,.req svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
@media (max-width:640px){.hud span.coin{width:24px!important;height:24px!important;flex-basis:24px!important}.hud span.bill{width:28px!important;height:19px!important;flex-basis:28px!important}.fuelpill .fuelico{width:18px;height:18px}}

/* ---- phones: toasts out of the way of popups, compact rows and buttons, a shorter side panel ---- */
body:has(#modal:not([hidden])) .toast,body:has(#house:not([hidden])) .toast{top:calc(8px + env(safe-area-inset-top,0px))!important;bottom:auto!important}
.order .pay{display:flex;flex-wrap:wrap;gap:3px 10px}.order .pay>span{white-space:nowrap}
.nbcard button{white-space:nowrap;font-size:16px;padding:6px 8px;min-height:40px}
.updbar{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;font:inherit;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(#5fc0f0,#2d8fe3);border:2px solid #1f5f9a;border-radius:999px;padding:10px 18px;box-shadow:0 4px 0 #1f5f9a,0 6px 14px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap}
@media (max-width:700px){
  .toast{max-width:calc(100% - 20px)!important}
  .toast span{font-size:13px!important;min-height:36px!important;padding:6px 14px 6px 44px!important;line-height:1.25}
  .toast span::before{width:26px!important;height:26px!important;margin-top:-13px!important}
  .nbcard button{font-size:14px}
}
@media (max-width:420px){.side{width:min(200px,calc(100vw - 186px))!important}.side .goals,.side .qtrack{font-size:12px}}

/* ---- painted produce: barn tiles show it a little larger */
.item>img{width:66px;height:66px;margin:-6px auto -6px;display:block}
.sheet.market .mart img{filter:drop-shadow(0 3px 4px rgba(60,40,15,.18))}

/* ---- Orders and Delivery Board cards: request tiles with progress, reward pills, a timer chip, ready cards glow ---- */
.obrd{padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.oc{position:relative;display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--sh-1);transition:box-shadow .2s}
.oc .nbface,.oc .town{width:64px;height:64px;border-radius:14px;display:block;border:1px solid var(--line-2);align-self:start}
.oc.ready{border-color:rgba(78,138,58,.5);background:linear-gradient(100deg,#f3fbec,#fff 45%);box-shadow:0 0 0 3px rgba(108,190,92,.16),var(--sh-1)}
.oc-m{min-width:0}
.oc-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:22px}
.oc-h strong{font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{flex:none;font-size:11.5px;font-weight:800;letter-spacing:.3px;padding:2px 9px;border-radius:999px}
.tag.ok{background:linear-gradient(#6aa650,#4e8a3a);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tmr{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft);background:#f4eee2;border-radius:999px;padding:2px 9px 2px 4px;font-variant-numeric:tabular-nums}
.tmr svg{width:15px;height:15px}.tmr.low{color:#a33b28;background:#fbe6df}
.rqs{display:flex;flex-wrap:wrap;gap:6px}
.rqt{display:grid;grid-template-columns:38px minmax(0,1fr);grid-template-rows:auto auto;column-gap:7px;align-items:center;background:#faf6ee;border:1px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;min-width:124px;max-width:190px}
.rqt img{grid-row:1/3;width:38px;height:38px;display:block}
.rqt>span{font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.rqt em{font-style:normal;display:flex;align-items:center;gap:6px;font-size:12.5px;color:#a33b28;font-variant-numeric:tabular-nums;line-height:1.2}
.rqt em i{flex:1;min-width:26px;height:5px;border-radius:3px;background:rgba(90,62,32,.12);overflow:hidden}
.rqt em i::before{content:'';display:block;height:100%;width:var(--p);background:linear-gradient(90deg,#efa48a,#d9694c);border-radius:3px}
.rqt.ok{background:#f1f9ea;border-color:rgba(78,138,58,.32)}.rqt.ok em{color:#3a6b2a}.rqt.ok em i::before{background:linear-gradient(90deg,#9fd37e,#5a9a40)}
.rwd{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.rwd>span{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px 2px 4px;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.5}
.rwd .rc{background:linear-gradient(#fff7da,#fbe5a0);color:#6b4a06;border:1px solid rgba(180,130,30,.32)}
.rwd .rc .coin{width:19px;height:19px;flex:none}
.rwd .rx{background:linear-gradient(#ebf5fd,#d2e6f8);color:#1f4f7d;border:1px solid rgba(61,127,191,.28);padding-left:10px}
.rwd .rb{background:#e4f3d4;color:#3a6b2a;font-size:12px;padding:2px 8px;cursor:help}
.rwd .rm{background:#f4eee2;color:var(--ink-soft);font-size:12.5px;font-weight:700;padding:2px 9px 2px 5px}
.rwd .rm svg{width:16px;height:15px}.rwd .rm.over{background:#fbe6df;color:#a33b28}
.oc .acts{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:112px}
.oc .acts .go{font-size:16px;padding:6px 16px;min-height:44px}
.oc .lnk{background:none;border:0;box-shadow:none;color:var(--ink-soft);font:inherit;font-size:12.5px;font-weight:700;min-height:30px;cursor:pointer;border-radius:8px}
.oc .lnk:hover{color:var(--danger);background:rgba(196,81,62,.07)}
.oc.ready .go{animation:ocpulse 1.8s ease-in-out infinite}
@keyframes ocpulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 0 #335e24,0 4px 12px rgba(58,107,42,.28),0 0 0 0 rgba(108,190,92,0)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 0 #335e24,0 4px 12px rgba(58,107,42,.28),0 0 0 6px rgba(108,190,92,.3)}}
@media (prefers-reduced-motion:reduce){.oc.ready .go{animation:none}}
.onext{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line-2);border-radius:16px;padding:13px;color:var(--ink-soft);font-size:13.5px;font-weight:700;background:rgba(255,255,255,.4)}
.onext svg{width:18px;height:18px;flex:none}
.ads2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.adc{display:grid;grid-template-columns:48px 1fr;grid-template-rows:auto 1fr auto;gap:3px 10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px 12px;box-shadow:var(--sh-1)}
.adc .adi{width:48px;height:48px;grid-row:1/3}
.adc strong{font-size:15px;align-self:end}
.adc small{color:var(--ink-soft);font-size:12px;line-height:1.4}
.adc .buy{grid-column:1/-1;min-height:38px;margin-top:6px}
.adc.on{background:linear-gradient(100deg,#f3fbec,#fff 55%);border-color:rgba(78,138,58,.4)}
.adc.on .pbar{grid-column:1/-1;margin-top:6px;height:8px}.adc.on .pbar i{background:linear-gradient(90deg,#9fd37e,#5a9a40)}
@media (max-width:640px){
  .obrd{padding:10px 10px 14px}
  .oc{grid-template-columns:50px minmax(0,1fr);gap:8px 10px;padding:9px 10px}
  .oc .nbface,.oc .town{width:50px;height:50px;border-radius:12px}
  .oc .acts{grid-column:1/-1;flex-direction:row-reverse;align-items:center;gap:8px}.oc .acts .go{flex:1;min-height:42px}
  .oc .lnk{padding:0 10px}
  .rqt{min-width:0;flex:1 1 130px;max-width:none}
}

  body .hud .xpbox{min-width:96px;margin-left:-12px;padding:3px 8px 3px 15px}
  body .hud .xplabel{display:none}body .hud .xpbar{height:12px!important}body .hud .xptext{font-size:9px}
  body .hud .pill{height:28px;padding:0 9px 0 3px;gap:4px}body .hud .pill b{font-size:14.5px}
  body .hud span.coin{width:20px!important;height:20px!important;flex-basis:20px!important}
  body .hud span.bill{width:24px!important;height:16px!important;flex-basis:24px!important;font-size:9px}
  body .hud .pill .plus{width:19px;height:19px;font-size:14px;margin-right:-6px}
  body .hud .wxchip{padding:0 8px 0 3px}body .hud .wxchip svg,body .hud .wxchip img{width:20px;height:20px}
  body .hud .wxchip b{font-size:11.5px}body .hud .wxchip small{display:none}
  body .fuelpill .fuelico{width:16px;height:16px}body .fuelpill #fuellabel{display:none}
  body .side{top:calc(max(4px,env(safe-area-inset-top,0px)) + 44px)!important;width:184px!important;gap:5px}
  body .side .goals,body .side .qtrack{font-size:12px;padding:4px 8px}
  body .goals-head{font-size:14px;gap:4px;min-height:0;padding:1px 0}body .goals-head small{font-size:9.5px}body .goals-head>span{white-space:nowrap}body .goals-head i{font-size:11px;padding:1px 7px}
  body .rightcol{top:calc(max(4px,env(safe-area-inset-top,0px)) + 44px);right:max(8px,env(safe-area-inset-right,0px));gap:4px}
  body .modesw{padding:2px;gap:2px}
  body .modesw button{min-height:28px;font-size:12px;padding:2px 8px 2px 5px;gap:3px}body .modesw button svg{width:17px;height:17px}
  body .seedpill{min-height:30px;padding:1px 8px 1px 2px;border-radius:12px}body .seedpill img{width:24px;height:24px}body .seedpill b{font-size:12.5px}
  body .needpill{min-width:100px;padding:3px 6px 4px;gap:2px;border-radius:12px}
  body .needpill .nhead img{width:20px;height:20px}body .needpill .nhead b{font-size:11px}
  body .needpill em{height:8px!important}body .needpill .nico{width:15px;height:15px}body .needpill .nico svg{width:9px;height:9px}body .needpill .nval{font-size:10px}
  body .dock{bottom:max(4px,env(safe-area-inset-bottom,0px));padding:4px 7px 17px;gap:4px;border-radius:16px}
  body .dock .mbtn{width:38px;height:38px;border-radius:11px}body .dock .mbtn svg{width:23px;height:23px}
  body .dock .mbtn>em{font-size:9px;bottom:-15px;padding:0 3px}
  body .dock .tool.market{width:48px;height:48px;margin:-12px 2px 0}body .dock .tool.market svg{width:29px;height:29px}
  body .dock .tool.market>span{font-size:10px;bottom:-15px}
  body .tut{width:178px!important;min-width:0!important;bottom:max(4px,env(safe-area-inset-bottom,0px))!important;padding:5px 7px!important}
  body .tut strong{font-size:11.5px!important}body .tut button{min-height:26px!important;font-size:11px!important}
}
/* celebration screens: Level Up and Ribbon Earned */
.sheet.celeS{overflow:hidden}
.sheet.celeS .sheet-head{overflow:hidden}
.sheet.celeS .sheet-head::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);transform:translateX(-120%);animation:celeShine 2.6s 0.6s ease-in-out infinite}
.sheet.celeS .sheet-head h2{letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 14px rgba(255,255,255,.35)}
.cele{position:relative;overflow:hidden;padding:4px 16px 16px;text-align:center;--c1:#ffd23f;--c2:#f2a21e;--ink:#5a3400}
.cele.pink{--c1:#ff9ec0;--c2:#e0457b;--ink:#6a1838}
.cele.white{--c1:#ffe9a8;--c2:#8a9aac;--ink:#3a4652}.cele.red{--c1:#ff8a7a;--c2:#e0352b;--ink:#6a1410}.cele.blue{--c1:#8ac4ff;--c2:#2d6fd0;--ink:#123a6a}
.cele::before{content:"";position:absolute;inset:-20px -20px auto;height:260px;background:radial-gradient(closest-side,color-mix(in srgb,var(--c1) 55%,transparent),transparent);pointer-events:none}
.cele-stage{position:relative;height:200px;display:grid;place-items:center;margin:0 -16px}
.cele-rays{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c1) 70%,#fff) 0 9deg,transparent 9deg 22.5deg);
  -webkit-mask:radial-gradient(closest-side,#000 18%,rgba(0,0,0,.6) 45%,transparent 72%);mask:radial-gradient(closest-side,#000 18%,rgba(0,0,0,.6) 45%,transparent 72%);
  opacity:.75;animation:celeSpin 22s linear infinite}
.cele-glow{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,240,.95),color-mix(in srgb,var(--c1) 60%,transparent) 55%,transparent);animation:celePulse 2.2s ease-in-out infinite}
.cele-emblem{position:relative;height:178px;width:auto;filter:drop-shadow(0 8px 10px rgba(60,30,0,.35));animation:celePop .8s cubic-bezier(.2,1.6,.4,1) both,celeFloat 3s 1s ease-in-out infinite}
.cele-spark{position:absolute;width:16px;height:16px;margin:-8px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px var(--c1));transform:scale(0);animation:celeTwinkle 1.6s ease-in-out infinite}
.cele-kicker{display:inline-block;margin-top:-6px;padding:3px 14px;border-radius:99px;background:var(--c2);color:#fff;font:800 12px/1.4 var(--f-body);letter-spacing:2px;text-transform:uppercase;box-shadow:0 2px 0 rgba(0,0,0,.2);animation:celeUp .5s .25s both}
.cele-big{font:36px/1.1 "Luckiest Guy",Impact,sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 6px 12px rgba(0,0,0,.25);margin:8px 0 2px;animation:celeUp .5s .35s both}
.cele-sub{margin:6px auto 12px;max-width:34ch;color:#4a3420;font-size:15px;animation:celeUp .5s .45s both}
.cele-rewards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.cele-rw{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:14px;background:linear-gradient(#fffdf6,#fbeed0);border:2px solid #e0c48a;box-shadow:0 3px 0 #d0b070,0 6px 12px rgba(80,50,10,.12);font:800 19px var(--f-body);color:#3a2310;animation:celePop .55s cubic-bezier(.2,1.6,.4,1) both}
.cele-rw b{min-width:3.2ch;text-align:left}
.cele-rw.done{animation:celeBump .35s ease-out}
.cele-rw .coin{width:26px;height:26px}
.cele-rw .xpdot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fd0ff,#2d6fd0);color:#fff;font:800 11px var(--f-body);border:2px solid #123a6a}
.cele-prog{margin:0 auto 14px;max-width:320px;text-align:left;animation:celeUp .5s .7s both}
.cele-pl{font:700 13px var(--f-body);color:#6a4a2a;margin-bottom:4px}
.cele-pn{font:700 12px var(--f-body);color:#8a6a4a;text-align:right;margin-top:3px}
.cele-bar{height:14px;border-radius:99px;background:#eadcbc;box-shadow:inset 0 2px 3px rgba(0,0,0,.18);overflow:hidden}
.cele-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(#ffe27a,#f2a21e);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.6);transition:width 1.1s cubic-bezier(.3,1,.4,1)}
.cele .unlocks{animation:celeUp .5s .9s both}
.cele .hint{animation:celeUp .5s .8s both}
.cele-go{min-width:200px;font-size:22px;animation:celeUp .5s 1s both,celeNudge 2.4s 2.4s ease-in-out infinite}
@keyframes celeSpin{to{transform:rotate(360deg)}}
@keyframes celePulse{50%{transform:scale(1.12);opacity:.85}}
@keyframes celePop{0%{transform:scale(.2) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes celeFloat{50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes celeTwinkle{0%,100%{transform:scale(0) rotate(0)}50%{transform:scale(var(--s)) rotate(90deg)}}
@keyframes celeUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes celeBump{40%{transform:scale(1.14)}}
@keyframes celeNudge{0%,88%,100%{transform:none}92%{transform:scale(1.06)}96%{transform:scale(.98)}}
@keyframes celeShine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.cele *,.sheet.celeS .sheet-head::after{animation:none!important}.cele-spark{transform:scale(.7)}}
@media (max-height:520px) and (orientation:landscape){.cele-stage{height:120px}.cele-emblem{height:110px}.cele-big{font-size:26px}.cele-rays{width:280px;height:280px;margin:-140px 0 0 -140px}}

/* compact popups: every sheet is smaller on laptops and desktops; the celebration screens are tighter everywhere */
@media (min-width:641px) and (min-height:521px){
  body .sheet{width:min(680px,100%);max-height:min(540px,100%)}
  body .sheet.wide{width:min(800px,100%);max-height:min(600px,100%)}
  body .sheet.small{width:min(340px,100%)}
  body .sheet-head{min-height:44px;padding:5px 12px}
  body .sheet-head h2{font-size:22px}
  body .sheet .body-pad{padding:12px 14px}
  body .sheet .go{font-size:17px;padding:9px 18px}
}
.cele{padding:2px 12px 12px}
.cele::before{height:180px}
.cele-stage{height:128px}
.cele-emblem{height:112px}
.cele-glow{width:110px;height:110px}
.cele-rays{width:280px;height:280px;margin:-140px 0 0 -140px}
.cele-kicker{font-size:10px;padding:2px 10px}
.cele-big{font-size:26px;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink),0 4px 8px rgba(0,0,0,.2);margin:5px 0 0}
.cele-sub{font-size:13px;margin:4px auto 8px}
.cele-rewards{gap:8px;margin:4px 0 10px}
.cele-rw{font-size:15px;padding:4px 10px 4px 6px;border-radius:11px}
.cele-rw .coin{width:20px;height:20px}.cele-rw .xpdot{width:22px;height:22px;font-size:9px}
.cele-prog{max-width:260px;margin-bottom:10px}.cele-pl{font-size:11px}.cele-pn{font-size:10px}.cele-bar{height:10px}
.cele .unlocks{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.cele .unlocks img{width:52px}.cele .unl{font-size:10px;border-width:2px}
.cele .hint{font-size:12px;padding:6px 8px}
.cele-go{min-width:150px;font-size:17px}
</style>

// {r1} a recipe, {c1} favorite crops, {p1:one|other} or {p1:one|few|many} a plural for the number in capture 1,

    if(k==='p')return packPlural(v,forms);if(k==='t')return L_t(v);if(k==='l')return v.split(', ').map(L_w).join(', ');
    if(k==='r')return v.split(' + ').map(x=>{const y=x.match(/^(.+) ×(\d+)$/);return y?L_w(y[1])+' ×'+y[2]:L_w(x)}).join(' + ');

const ITEMS={};
/* Economy pacing. The tables above are the design values; these knobs set the pace of the whole game in one place.
   Crops, animals and trees take PACE times longer than the tables say and buildings MAKER_PACE times longer, so a full
   field turns over every few minutes instead of every minute. Crops and made goods are worth less than listed, and the
   barn pays BARN_RATE of an item's value, while neighbor orders and Dale's contracts pay the full value and more:
   selling to people beats dumping goods in the barn. Every crop still pays back its seed and the re-plow. */
const PACE=5,MAKER_PACE=3,CROP_VALUE=.65,MADE_VALUE=.7,BARN_RATE=.65;
for(const id in CROPS){CROPS[id].grow*=PACE;CROPS[id].sell=Math.round(CROPS[id].sell*CROP_VALUE)}
for(const id in ANIMALS)ANIMALS[id].every*=PACE;
for(const id in TREES)TREES[id].every*=PACE;
for(const id in MAKERS)for(const r of MAKERS[id].recipes)r.time*=MAKER_PACE;
for(const id in CROPS)ITEMS[id]={name:CROPS[id].name,sell:CROPS[id].sell,cat:'crops',lvl:CROPS[id].lvl};
for(const id in CROPS)ITEMS['g_'+id]={name:'Golden '+CROPS[id].name,sell:CROPS[id].sell*6,cat:'crops',lvl:CROPS[id].lvl,gold:true};

// Fences and hedges join up on their own: each piece reaches toward every matching neighbor (bits 1 = x-1,

function uiSoon(){if(uiQueued)return;uiQueued=true;requestAnimationFrame(()=>{uiQueued=false;hud();if(S.q)renderQuest()})}
let saveQueued=0;
function saveSoon(){if(saveQueued)return;saveQueued=setTimeout(()=>{saveQueued=0;save()},400)}
addEventListener('pagehide',()=>{if(saveQueued){clearTimeout(saveQueued);saveQueued=0;save()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveQueued){clearTimeout(saveQueued);saveQueued=0;save()}});
function changed(){buildOcc();if(syncHousing())buildOcc();buildBars();syncGround();uiSoon();saveSoon()}
// The top level is 99. Reaching it brings the Champion prize; XP stops counting after that.
const MAX_LVL=99,CHAMP={coins:50000,cash:50};
function addXP(n){
  if(S.level>=MAX_LVL){S.xp=0;return}
  if(S.home&&isFresh()){S.xpCarry=(S.xpCarry||0)+n*.1;const extra=Math.floor(S.xpCarry);S.xpCarry-=extra;n+=extra}
  S.xp+=n;const l0=S.level;
  while(S.level<MAX_LVL&&S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;S.coins+=20*S.level;S.cash+=1}
  if(S.level>=MAX_LVL)S.xp=0;
  if(S.level>l0){SFX.level();showLevelUp(l0);if(S.level>=MAX_LVL&&!S.champ)setTimeout(championGift,600);else setTimeout(nextQuest,800)}
}
function championGift(){
  if(S.champ)return;S.champ=Date.now();S.coins+=CHAMP.coins;S.cash+=CHAMP.cash;S.inv['deco:champion']=(S.inv['deco:champion']||0)+1;changed();
  confetti();setTimeout(confetti,700);SFX.golden();
  modal({title:'Champion Farmer!',color:'gold',small:true,noClose:true,render(b){
    const p=el('div','body-pad'),im=el('img');if(!ICONS['decor:champion'])ICONS['decor:champion']=renderIcon('decor','champion');im.src=ICONS['decor:champion'];im.alt='';im.style.cssText='width:150px;height:auto;display:block;margin:0 auto';p.appendChild(im);
    p.appendChild(el('p',null,(S.farmerName?S.farmerName+', you':'You')+' reached Level 99, the highest level in Farm Village!'));
    p.appendChild(el('p',null,'Your special gift: the Champion Trophy, '+CHAMP.coins.toLocaleString()+' coins and '+CHAMP.cash+' Farm Cash. Place the trophy from your Gift Box.'));
    p.appendChild(rewardRow([['coins',CHAMP.coins],['cash',CHAMP.cash]]));
    const go=el('button','go','Thank you!');go.dataset.focus='1';go.onclick=closeModal;p.appendChild(go);b.appendChild(p);
  }});
}
function unlockedAt(l){const out=[];for(const cat of[CROPS,ANIMALS,TREES,DECOR,FARM])for(const id in cat)if(cat[id].lvl===l&&!cat[id].cash)out.push(cat[id].name);return out}

/* ================= modal system ================= */
const mq=[];
function modal(spec){mq.push(spec);if(mq.length===1)openTop()}
function openTop(){
  const spec=mq[0];if(!spec){$('modal').hidden=true;return}
  clearTimeout(modalOut);$('modal').classList.remove('closing');
  if(mq.length===1&&dockPick){for(const b of document.querySelectorAll('.dock .on'))b.classList.remove('on');dockPick.classList.add('on')}
  $('sheet').className='sheet'+(spec.small?' small':'')+(spec.wide?' wide':'')+(spec.cls?' '+spec.cls:'');
  $('sheetHead').className='sheet-head'+(spec.color?' '+spec.color:'');
  $('sheetTitle').textContent=spec.title;
  $('sheetClose').hidden=!!spec.noClose;
  const body=$('sheetBody');body.innerHTML='';body.scrollTop=0;spec.render(body);
  $('modal').hidden=false;
  const f=body.querySelector('[data-focus]')||(spec.noClose?body.querySelector('button'):$('sheetClose'));if(f)f.focus({preventScroll:true});
}
function closeModal(){const spec=mq.shift();if(spec&&spec.onClose)spec.onClose();if(mq.length)openTop();else{hideModal();hud()}}
// The sheet shrinks and fades before the modal hides; opening another sheet meanwhile cancels it.
let modalOut=0,dockPick=null;
function hideModal(){
  for(const b of document.querySelectorAll('.dock .on'))b.classList.remove('on');
  const m=$('modal');if(reduce||m.hidden){m.hidden=true;return}
  m.classList.add('closing');clearTimeout(modalOut);modalOut=setTimeout(()=>{m.classList.remove('closing');if(!mq.length)m.hidden=true},180);
}
// Remember which dock button was pressed, so the sheet it opens can mark it as the selected tab.
document.querySelector('.dock').addEventListener('pointerdown',e=>{if(e.target.closest('.mbtn,.tool'))haptic()},{passive:true});
document.querySelector('.dock').addEventListener('click',e=>{dockPick=e.target.closest('.mbtn,.tool');setTimeout(()=>dockPick=null)},true);
function rerender(){if(mq.length){const b=$('sheetBody'),st=b.scrollTop;b.innerHTML='';mq[0].render(b);b.scrollTop=st}}
$('sheetClose').onclick=()=>{SFX.click();closeModal()};
$('modal').addEventListener('click',e=>{if(e.target===$('modal')&&mq[0]&&!mq[0].noClose)closeModal()});
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

/* ================= daily goals ================= */
// Three fresh goals every day, measured from the farm stats; finish all three for a Farm Cash bonus.
const GOAL_POOL={
  deliver:{n:[1,1,2],txt:n=>'Send '+n+(n>1?' deliveries':' delivery')+' with Dale'},
  harvest:{n:[8,15,25],txt:n=>'Harvest '+n+' crops'},
  plow:{n:[8,15,25],txt:n=>'Plow '+n+' plots'},
  animal:{n:[4,8,12],txt:n=>'Collect from animals '+n+' times'},
  tree:{n:[3,6,10],txt:n=>'Pick fruit trees '+n+' times'},
  decor:{n:[1,3,5],txt:n=>'Place '+n+(n>1?' new things':' new thing')+' on your farm'},
  help:{n:[1,2,3],txt:n=>'Help '+n+(n>1?' neighbors':' neighbor')},
  visit:{n:[1,2,3],txt:n=>'Say hi to '+n+(n>1?' visiting neighbors':' visiting neighbor')},
  order:{n:[1,2,3],txt:n=>'Fill '+n+(n>1?' neighbor orders':' neighbor order')}
};
function ensureGoals(){
  const d=today();if(S.goals&&S.goals.day===d)return;
  const tier=Math.min(2,Math.floor(S.level/5)),keys=Object.keys(GOAL_POOL).filter(k=>S.level>=NB_LVL||!['help','visit','order'].includes(k)).sort(()=>Math.random()-.5);
  // keep one easy farming goal in every set
  const pick=['harvest','plow'].includes(keys[0])?keys.slice(0,3):[Math.random()<.5?'harvest':'plow',...keys.filter(k=>k!=='harvest'&&k!=='plow').slice(0,2)];
  S.goals={day:d,bonus:false,list:pick.map(k=>({k,n:GOAL_POOL[k].n[tier],base:S.stats[k]||0,claimed:false,coins:25+20*tier+GOAL_POOL[k].n[tier]*2,xp:8+6*tier}))};
  save();
}
function goalProg(q){return Math.min(q.n,(S.stats[q.k]||0)-q.base)}
function renderGoals(){
  const box=$('goals');if(!box||!S)return;ensureGoals();
  const open=S.tips.goalsOpen===true,done=S.goals.list.filter(q=>q.claimed).length;
  box.hidden=done===3&&S.goals.bonus;box.className='goals'+(open?'':' closed');box.innerHTML='';
  const head=el('button','goals-head');head.setAttribute('aria-expanded',String(open));head.innerHTML='<span><small>Daily</small>Today\'s Goals</span><i>'+done+'/3</i>';
  head.onclick=()=>foldPanel(box,head,'goalsOpen');box.appendChild(head);
  const fold=el('div','gfold'),list=el('div','goals-list');
  S.goals.list.forEach((q,i)=>{
    const p=goalProg(q),fin=p>=q.n,row=el('div','goal'+(q.claimed?' done':fin?' ready':''));
    row.appendChild(el('span','chk'));row.appendChild(el('span',null,GOAL_POOL[q.k].txt(q.n)));
    const meta=el('div','gmeta');
    if(fin&&!q.claimed){const c=el('button','claim','Claim +'+q.coins);c.onclick=()=>claimGoal(q);meta.appendChild(c)}
    else if(q.claimed)meta.appendChild(el('span',null,'Done!'));
    else{const bar=el('div','gbar'),f=el('b');bar.style.flex='1';bar.appendChild(f);animBar(f,'g:'+S.goals.day+':'+i,p/q.n*100);meta.appendChild(bar);meta.appendChild(el('span',null,p+'/'+q.n));
      const r=el('span','grew');r.innerHTML='<span class="coin"></span>';r.append(String(q.coins));meta.appendChild(r)}
    row.appendChild(meta);list.appendChild(row);
    const sk='g:'+S.goals.day+':'+i,state=q.claimed?2:fin?1:0;if(GOAL_ST[sk]!=null&&GOAL_ST[sk]<state)flash(row);GOAL_ST[sk]=state;
  });
  const bonus=el('div','bonus');
  if(done===3&&!S.goals.bonus){bonus.appendChild(el('span',null,'All done! Bonus:'));const c=el('button','claim','+2 Farm Cash');c.onclick=()=>{S.goals.bonus=true;S.cash+=2;SFX.level();confetti();toast('Daily goals complete! +2 Farm Cash.');changed();renderGoals()};bonus.appendChild(c)}
  else bonus.appendChild(el('span',null,S.goals.bonus?'All goals done. New goals tomorrow!':'Finish all three for +2 Farm Cash.'));
  list.appendChild(bonus);fold.appendChild(list);box.appendChild(fold);
}
const GOAL_ST={};
function claimGoal(q){
  if(q.claimed||goalProg(q)<q.n)return;
  q.claimed=true;S.coins+=q.coins;addMat(randMat(),2);SFX.coin();toast('Goal complete! +'+q.coins+' coins, +'+q.xp+' XP.');addXP(q.xp);changed();renderGoals();
}

/* ================= little celebrations ================= */
function confetti(){
  if(reduce)return;const box=el('div','confetti');
  const cols=['#ffd23f','#e0457b','#3f9a3c','#2d8fe3','#f2a21e','#fff','#7a4ec0'];
  for(let i=0;i<70;i++){const c=el('i');c.style.left=Math.random()*100+'%';c.style.background=cols[i%cols.length];c.style.animationDelay=Math.random()*.6+'s';c.style.setProperty('--dx',(Math.random()*160-80)+'px');c.style.setProperty('--r',(Math.random()*900-450)+'deg');box.appendChild(c)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3600);
}
let shownCoins=null,shownCash=null,coinRaf=0,shownLvl=null,shownXP=null,shownXPv=0;
// A small +N / −N that floats up out of a HUD slot when its value changes.
function delta(host,text,cls){if(reduce||!host)return;const d=el('span','delta '+cls,text);host.appendChild(d);setTimeout(()=>d.remove(),1150)}
function animCounters(){
  const ce=$('coins'),target=S.coins;
  if(shownCoins===null||reduce){shownCoins=target;ce.textContent=target.toLocaleString()}
  else if(target!==shownCoins){
    const from=shownCoins,t0=performance.now();shownCoins=target;bumpPill(ce);cancelAnimationFrame(coinRaf);
    delta(ce.parentElement,(target>from?'+':'−')+Math.abs(target-from).toLocaleString(),target>from?'up':'down');
    const step=()=>{const k=Math.max(0,Math.min(1,(performance.now()-t0)/500)),v=Math.round(from+(target-from)*(1-Math.pow(1-k,3)));ce.textContent=v.toLocaleString();if(k<1)coinRaf=requestAnimationFrame(step)};coinRaf=requestAnimationFrame(step);
  }
  if(shownCash!==null&&shownCash!==S.cash){bumpPill($('cash'));delta($('cash').parentElement,(S.cash>shownCash?'+':'−')+Math.abs(S.cash-shownCash),S.cash>shownCash?'up':'down')}
  shownCash=S.cash;$('cash').textContent=S.cash;
}
function bumpPill(e){const p=e.parentElement;p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump')}

  x.beginPath();x.arc(sx,sy,m*.035+12,0,7);x.fillStyle='#fffcee';x.fill();

  const cloud=(cx,cy,s,a)=>{x.save();x.globalAlpha=a;x.filter='blur('+Math.max(1.5,s*.07).toFixed(1)+'px)';
    for(let k=0;k<8;k++){const t=k/7,ox=(t-.5)*s*2.4+(rnd(k,cx)-.5)*s*.25,r=s*(.34+.32*Math.sin(t*Math.PI))*(.85+rnd(cx,k)*.3),oy=-r*.55;

  for(let i=0;i<6;i++){const cx=w*(.04+i*.18+rnd(i,1)*.08);if(Math.abs(cx-sx)<m*.08)continue;cloud(cx,h*(.12+rnd(i,2)*.2),m*(.035+rnd(i,3)*.03)+16,.5+rnd(i,4)*.4)}

  const ridge=(base,amp,f,seed,top,bot)=>{ridgePath(base,amp,f,seed);x.fillStyle=lin(base-amp,base+h*.12,[top,bot]);x.fill()};
  ridge(hz-h*.015,h*.075,4.6,1.3,'#93abc0','#a9bccb');

  // the meadow, with grass blades and a few wildflowers

  x.save();ridgePath(ground-h*.005,h*.02,2.6,.7);x.clip();

// Queue a feeding trip to every hungry animal (optionally just one breed), as far as the feed in the barn goes.

  if(n)toast('Feeding '+n+' animal'+(n>1?'s':'')+'.'+(short?' Not enough feed for the rest.':''));

  else toast('No hungry animals right now.');

const MK_UP=[null,{slots:3,speed:1},{slots:4,speed:.85},{slots:5,speed:.7}];

function makerAdd(key,i){
  const o=S.tiles[key];if(!o)return;const M=MAKERS[o.id],r=M.recipes[i],now=Date.now();o.q=o.q||[];

/* ================= neighbor orders and advertising ================= */
const NB_LVL=5;function nbOpen(){return S.level>=NB_LVL}
function nbLocked(){if(nbOpen())return false;SFX.error();toast('Your neighbors move in at Level '+NB_LVL+'. Then you can trade with them and visit their farms.');return true}
function adOn(){return S.ad&&S.ad.until>Date.now()?S.ad.id:null}
function orderEvery(){const a=adOn();return a?ADS[a].every:150}
function canFill(o){return o.items.every(([id,n])=>have(id)>=n)}
function orderPool(){
  const own=new Set(),out=[];
  for(const k in S.tiles){const o=S.tiles[k];if(o.k==='animal'&&hasHome(o.id))own.add('a_'+o.id);else if(o.k==='tree')own.add('t_'+o.id);else if(o.k==='mk')own.add('mk:'+o.id)}
  for(const id in CROPS)if(CROPS[id].lvl<=S.level)out.push(id);
  for(const id of own)if(ITEMS[id])out.push(id);
  for(const m in MAKERS)if(own.has('mk:'+m))for(const r of MAKERS[m].recipes)if(ITEMS[r.out].cat!=='supply'&&recipeLvl(r)<=S.level&&Object.keys(r.in).every(k=>CROPS[k]?CROPS[k].lvl<=S.level:(k.startsWith('a_')||k.startsWith('t_'))?own.has(k):true)&&!out.includes(r.out))out.push(r.out);
  return out;
}
function newOrder(){
  const pool=orderPool(),busy=new Set(S.orders.map(o=>o.who)),free=NEIGHBORS.filter(n=>!busy.has(n.id));
  if(!pool.length||!free.length)return null;
  const R=Math.random,pick=a=>a[Math.floor(R()*a.length)],who=pick(free);
  const lines=Math.min(pool.length,1+(S.level>=4&&R()<.5?1:0)+(S.level>=8&&R()<.35?1:0)),items=[],used=new Set();
  while(items.length<lines){const id=pick(pool);if(used.has(id))continue;used.add(id);const it=ITEMS[id],want=60+S.level*25+R()*90;items.push([id,Math.max(1,Math.min(makeCap(id,20),Math.round(want/it.sell)))])}
  const base=items.reduce((a,[id,n])=>a+ITEMS[id].sell*n,0),a=adOn(),mult=1.2+R()*.25+(a?ADS[a].boost:0);
  return{id:Date.now().toString(36)+R().toString(36).slice(2,6),who:who.id,items,coins:Math.max(5,Math.round(base*mult/5)*5),xp:3+Math.round(base/40),base,made:Date.now()};
}
// Orders and contracts you cannot fill do not block the board forever: after a while they leave and a new one comes.
const POST_LIFE=30*60e3;
function postLeft(o,now){return Math.max(0,(o.made||now)+POST_LIFE-now)}
function expirePosts(list,now,keep){const out=[];let gone=0;for(const o of list){if(!o.made)o.made=now;if(keep&&keep(o)||canFill(o)||postLeft(o,now)>0)out.push(o);else gone++}return[out,gone]}
function tickOrders(){
  if(!S||VIS||!nbOpen())return;const now=Date.now();let added=null;
  {const[o2,gone]=expirePosts(S.orders,now);if(gone){S.orders=o2;S.orderT=Math.min(S.orderT,now+20000)}}
  if(typeof S.orderT!=='number')S.orderT=now+6000;
  while(S.orders.length<ORDER_MAX&&S.orderT<=now){const o=newOrder();if(!o){S.orderT=now+30000;break}S.orders.push(o);added=o;S.orderT+=orderEvery()*1000}
  if(S.orders.length>=ORDER_MAX&&S.orderT<now)S.orderT=now+orderEvery()*1000;
  if(added){const n=NEIGHBORS.find(x=>x.id===added.who);toast(n.name+' posted a new order on the Orders board!');hud();if(mq[0]&&mq[0].orders)rerender()}
}
function deliver(o){
  if(!canFill(o)){SFX.error();toast('You do not have everything for this order yet.');return}
  const n=NEIGHBORS.find(x=>x.id===o.who);
  for(const[id,k]of o.items)takeGood(id,k);
  S.orders=S.orders.filter(x=>x!==o);S.coins+=o.coins;
  if(Math.random()<.35)addMat(randMat(),1);

  const v=visitors.find(v=>v.n.id===n.id);if(v)say(v,'Thanks for the order!');

}
function decline(o){
  const n=NEIGHBORS.find(x=>x.id===o.who);S.orders=S.orders.filter(x=>x!==o);S.orderT=Math.min(S.orderT,Date.now()+30000);

// he comes back a few minutes later with the payment. It is the best XP on the farm, but it takes time.
const DRIVER={id:'dale',name:'Dale',look:Object.assign(defaultLook(),{gender:'male',skin:'#d9a37a',eyes:'#3f6fc0',hair:'short',hairColor:'#2a1a12',face:'beard',glasses:'none',hat:'cap',hatColor:'#c8392b',top:'plaid',topColor:'#3f6fc0',bottom:'jeans',bottomColor:'#3a4650',shoes:'#5a3418',acc:'none'})};
const TOWNS=[
  {name:'Valley Grocer',km:1,likes:['crops','fruit']},{name:'Hollow Bakery',km:2,likes:['crops','animal','made']},
  {name:'Riverside Market',km:2,likes:['crops','fruit','animal']},{name:'Mill Town Café',km:3,likes:['made','animal','fruit']},
  {name:'Harbor Cannery',km:4,likes:['crops','fruit','animal']}

const TRUCK_CAP=[0,20,35,60],TRUCK_UP=[null,{coins:1500,mats:{board:10,nail:10}},{coins:5000,mats:{board:20,nail:20,paint:8}}];
const DRIVE=5000; // ms to drive off screen or back in: an easy, unhurried pace
const BOARD=2600; // ms for Dale to walk to the cab, climb in and shut the door
function tripSecs(c){return Math.max(60,Math.min(240,c.time*24))} // a real trip to town: one to four minutes
function dv(){if(!S.deliv)S.deliv={jobs:[],next:0,run:null,lv:1};return S.deliv}
function truckCap(){return TRUCK_CAP[dv().lv||1]}
// Dale's first job on a new farm is a small wheat run you can fill right after the first harvest.
function starterContract(){return{id:'start'+Date.now().toString(36),to:'Valley Grocer',items:[['wheat',2]],coins:200,xp:20,time:5,base:280,starter:true}}
function newContract(){
  const d=dv();
  if(!(S.stats.deliver>0)&&!d.jobs.some(c=>c.starter)&&!(d.run&&d.run.job.starter))return starterContract();
  const pool=orderPool();if(!pool.length)return null;
  const R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
  // early on, Dale mostly asks for what is already in the barn, in small amounts

function genFarm(n){

  put(1,1,{k:'bld',id:'house'});put(4,1,{k:'bld',id:'barn',lv:Math.min(6,1+Math.floor(n.lvl/5))});tiles['1,1'].lv=Math.min(6,2+Math.floor(n.lvl/8));

  // crop field on the left

  for(let y=5;y<Math.min(sz-3,5+rows);y++){const c=myCrops[Math.floor((y-5)/Math.max(1,Math.ceil(rows/3)))%3];for(let x=1;x<1+fw;x++){
    const r=R();if(r<.06){put(x,y,{k:'plot',fallow:true});continue}if(r<.1){put(x,y,{k:'plot',crop:null,t:0});continue}
    const f=R()<.35?1.05+R()*.4:.1+R()*.85;put(x,y,{k:'plot',crop:c,t:now-CROPS[c].grow*1000*f})}}

  let hy=4;

    const cnt=2+Math.floor(R()*3);for(let k=0;k<cnt;k++){for(let t=0;t<12;t++){const x=ax+2+Math.floor(R()*(sz-ax-3)),y=hy+Math.floor(R()*3);if(put(x,y,{k:'animal',id,fed:true,t:now-ANIMALS[id].every*1000*R()*1.4}))break}}

  $('vbName').textContent=VIS.n.farm;$('vbInfo').textContent=VIS.n.name+', Level '+VIS.n.lvl+' · Helped '+c+' of '+HELP_MAX+' today';
}
function helpsQueued(){return queue.filter(j=>j.kind==='fert').length+(farmer.job&&farmer.job.kind==='fert'?1:0)}
function actVisit(hx,hy){
  const key=target(hx,hy),name=VIS.n.name;
  if(!key){toast('Click '+name+"'s crops, animals or fruit trees to help out.");return}
  const o=S.tiles[key];
  if(o.k==='bld'){toast(o.id==='house'?name+"'s farmhouse.":name+"'s barn.");return}
  if(!((o.k==='plot'&&o.crop)||o.k==='animal'||o.k==='tree')){toast('Help with crops, animals or fruit trees.');return}
  if(o.helped){toast('You already helped there.');return}
  if(pend[key])return;
  if(helpedHere(VIS.n.id).length+helpsQueued()>=HELP_MAX){toast('You have helped '+name+' '+HELP_MAX+' times today. Come back tomorrow!');return}
  enqueue({kind:'fert',tiles:[key.split(',').map(Number)]});
}
function helpDone(x,y){
  const n=VIS.n,list=helpedHere(n.id);if(list.length>=HELP_MAX)return;
  list.push(x+','+y);S.coins+=6;floatText(x,y-.6,'+6','#ffd23f');addXP(1);maybeMat(x,y,.15);
  if(list.length===1)stat('help');
  const host=visitors.find(v=>v.host);
  if(list.length>=HELP_MAX){
    const[cat,id]=giftFor(),def=cat==='animal'?ANIMALS[id]:cat==='tree'?TREES[id]:DECOR[id];S.inv[cat+':'+id]=(S.inv[cat+':'+id]||0)+1;
    SFX.find();confetti();toast(n.name+' says thanks for all the help and sent you a '+def.name+'! Find it in your Gift Box.');if(host)say(host,'You are the best neighbor!');
  }else if(host&&Math.random()<.5)say(host,['Thank you!','That helps a lot!','You are so kind!','Wonderful, thanks!'][Math.floor(Math.random()*4)]);
  updateVisitBar();
}
function visitTip(hx,hy){
  const key=target(hx,hy);if(!key)return'';const o=S.tiles[key];
  if(o.k==='bld')return VIS.n.name+(o.id==='house'?"'s farmhouse":"'s barn");
  if((o.k==='plot'&&o.crop)||o.k==='animal'||o.k==='tree')return o.helped?'Helped. Thanks!':'Help '+VIS.n.name+' here';
  return o.k==='deco'?DECOR[o.id].name:o.k==='home'?HOMES[o.id].name:'';
}

/* ================= job planning ================= */
function effective(x,y){
  const k=x+','+y,pl=pend[k],last=pl&&pl[pl.length-1];
  if(last)return{pending:last};
  const key=occ[k];if(!key)return{grass:true};
  return{key,o:S.tiles[key]};
}
function planAt(x,y,kindWanted){
  const e=effective(x,y);
  if(e.pending){
    if(e.pending==='plow')return'plant';
    if(e.pending==='harvest'||e.pending==='clear')return'plow';
    return null;
  }
  if(e.grass)return kindWanted==='plow'||tool==='plow'||tool==='tractor'||S.tapMode==='plow'?'plow':'walk';
  const o=e.o;
  if(o.k==='plot'){
    if(o.fallow)return'plow';
    if(!o.crop)return'plant';
    const s=cropState(o,Date.now());
    if(s.st==='ripe')return'harvest';
    if(s.st==='withered')return'clear';
    return null;
  }
  return null;
}
function clickMulti(hx,hy){
  const key=target(hx,hy);
  if(key){
    const o=S.tiles[key],[x,y]=key.split(',').map(Number);
    if(o.k==='animal'&&!VIS)animalReact(key);
    if(o.k==='animal'&&!hasHome(o.id)){SFX.error();toast(plural(ANIMALS[o.id].name)+' need a '+HOMES[o.id].name+' before they can produce. Find it in Market > Homes.');return}
    if(o.k==='home'){SFX.click();showHome(key);return}
    if(o.k==='mk'){SFX.click();clickMaker(key);return}
    if(o.k==='animal'&&hungry(o)){
      if(pend[key])return;
      const need=feedNeed(o.id);if(have('feed')<need){SFX.error();toast(ANIMALS[o.id].name+' is hungry and needs '+need+' feed. Make feed at a Feed Mill or buy a Feed Sack in Market > Farm.');return}
      enqueue({kind:'feed',tiles:[[x,y]]});return;
    }
    if(o.k==='animal'||o.k==='tree'){
      if(pend[key]){return}
      const def=defOf(o),left=readyIn(o,def,Date.now());
      if(isBaby(o)||left>0){infoCard(key);return}
      enqueue({kind:'collect',tiles:[[x,y]]});return;
    }
    if(o.k==='deco'){
      if(ROTATABLE.has(o.id)){if(o.id==='gate'||!wallLinks(x,y,o)){o.r=o.r?0:1;SFX.place();changed()}else toast('Connected fences and hedges line up on their own. Use Move to shift a piece.');return}
      infoCard(key);return;
    }
    if(o.k==='bld'){if(o.id==='barn'){SFX.click();showBarn()}else if(o.id==='house'&&!VIS)enterHouse();else infoCard(key);return}
    hx=x;hy=y;if(o.k==='plot')showTapTip(x,y);
    if(o.k==='plot'&&o.crop&&S.tapMode==='walk'&&tool==='multi'){SFX.click();if(!matchMedia('(hover: none)').matches)TAPTIP={x,y,t:performance.now()};return}
  }
  if(S.tapMode==='walk'&&tool==='multi'){walkTo(hx,hy);return}
  const kind=planAt(hx,hy);
  if(kind==='walk'){walkTo(hx,hy);return}
  if(tool==='plow'&&kind!=='plow'){toast('The hoe turns grass into new farmland. Switch to the Multi-tool to plant and harvest.');return}
  if(!kind){
    const e=effective(hx,hy);
    if(e.o&&e.o.k==='plot'&&e.o.crop){const s=cropState(e.o,Date.now());
      if(s.st!=='ripe'&&s.st!=='withered'){
        if(!e.o.wet){enqueue({kind:'water',tiles:[[hx,hy]]});return}
        if(!e.o.fert&&have('fert')>queue.filter(j=>j.kind==='fertilize').length){enqueue({kind:'fertilize',tiles:[[hx,hy]]});return}
      }
      toast(s.c.name+': ready in '+fmt(s.left)+'.'+(s.st!=='ripe'&&!e.o.fert&&e.o.wet?' Fertilizer from the barn doubles the harvest.':''))}
    return;
  }
  if(autoVehicle(kind,hx,hy))return;
  queueKind(kind,[[hx,hy]],null);
}
// Plowing grass makes new farmland (NEW_PLOT coins); plowing a harvested plot again costs PLOW_COST.
function plowCost(x,y){const e=effective(x,y);return e.grass?NEW_PLOT:PLOW_COST}
function costFor(kind,x,y){if(kind==='plow')return plowCost(x,y);if(kind==='plant')return CROPS[S.seed].cost;return 0}
// Seeds come from the barn first: a crop you have in storage is planted for free.
function queueKind(kind,tiles,vehicle){
  const c=CROPS[S.seed];
  if(kind==='plant'&&S.level<c.lvl){SFX.error();toast(c.name+' unlock at Level '+c.lvl+'.');return false}
  if(kind==='harvest'&&tiles.length&&harvestBlocked(tiles[0][0],tiles[0][1]))return false;
  const costs={},free=new Set();let cost=0,fromBarn=0;
  if(kind==='plant'){fromBarn=Math.min(tiles.length,have(S.seed));for(let i=0;i<tiles.length;i++){const k=tiles[i][0]+','+tiles[i][1];if(i<fromBarn){free.add(k);costs[k]=0}else{costs[k]=c.cost;cost+=c.cost}}}
  else for(const[x,y]of tiles){const k=x+','+y,v=costFor(kind,x,y);costs[k]=v;cost+=v}
  if(S.coins<cost){SFX.error();toast(kind==='plow'?(cost>=NEW_PLOT?'New farmland costs '+NEW_PLOT+' coins a plot. Sell some goods from the barn first.':'Plowing costs '+PLOW_COST+' coins. Sell some goods from the barn first.'):'You need '+cost+' coins to plant '+c.name.toLowerCase()+'.');return false}
  S.coins-=cost;if(fromBarn){takeGood(S.seed,fromBarn);floatText(tiles[0][0],tiles[0][1]-.4,'-'+fromBarn+' '+c.name+' from the barn','#e8f5c8')}
  const job={kind,tiles,vehicle,seed:S.seed,costs,free:kind==='plant'?free:null};
  enqueue(job);hud();return true;
}
// Free roam: tapping empty grass sends the farmer for a walk there.
function walkTo(x,y){
  for(let i=queue.length-1;i>=0;i--)if(queue[i].kind==='walk')queue.splice(i,1);
  walkMark={x,y,t:performance.now()};
  if(farmer.job&&farmer.job.kind==='walk'){farmer.job.stand=[x+.5,y+.5];return}
  queue.push({kind:'walk',tiles:[[x,y]],stand:[x+.5,y+.5]});
}
let walkMark=null;
function refund(j,k){if(j.free&&j.free.has(k)){S.goods[j.seed]=(S.goods[j.seed]||0)+1}else S.coins+=(j.costs&&j.costs[k])||0}
function fuelCost(v){return Math.max(1,vlvl(v))}
function refuel(quiet){
  fuelNow();let n=0;
  while(have('diesel')>0&&S.fuel<=FUEL_MAX-CAN_FUEL/2){takeGood('diesel',1);S.fuel=Math.min(FUEL_MAX,S.fuel+CAN_FUEL);n++}
  if(n){if(!quiet){SFX.engine();toast('Poured in '+n+' can'+(n>1?'s':'')+' of diesel. Fuel: '+S.fuel+' / '+FUEL_MAX+'.')}changed();return true}
  if(!quiet){if(S.fuel>FUEL_MAX-CAN_FUEL/2)toast('The tank is already full.');else{SFX.error();toast('No diesel in the barn. Build a Diesel Press (Market > Buildings) to make it from soybeans, sunflowers or corn.')}}
  return false;
}
function clickVehicle(hx,hy,vv,same){
  const v=vv||tool,want={tractor:'plow',seeder:'plant',harvester:'harvest'}[v],cost=fuelCost(v),auto=!!vv;
  if(fuelNow()<cost){if(have('diesel')){takeGood('diesel',1);S.fuel=Math.min(FUEL_MAX,S.fuel+CAN_FUEL);toast('Topped up the tank with a can of diesel.');SFX.engine()}else{if(auto)return false;SFX.error();toast('Out of fuel! Make diesel at a Diesel Press, buy a can in Market > Farm, or wait for the tank to trickle back.');return}}
  // when the Multi-tool drives for you, it only takes tiles like the one you tapped (no surprise new farmland)
  const area=vehicleArea(hx,hy,v).filter(([x,y])=>{const k=planAt(x,y);if(!(k===want||(want==='harvest'&&k==='clear')))return false;return!same||same(x,y)});
  if(auto&&area.length<2)return false;
  if(!area.length){toast(v==='tractor'?'Point the tractor at grass or harvested plots.':v==='seeder'?'Point the seeder at plowed plots.':'Point the harvester at ripe crops.');return}
  if(want==='harvest'){
    S.fuel-=cost;enqueue({kind:'harvest',tiles:area,vehicle:v});hud();return true;
  }
  if(queueKind(want,area,v)){S.fuel-=cost;hud();return true}
  return auto?true:undefined;
}
// The Multi-tool brings out the tractor, seeder or harvester by itself when you own one and there is fuel.
const AUTO_VEH={plow:'tractor',plant:'seeder',harvest:'harvester',clear:'harvester'};
// What the Multi-tool would do with a machine at this tile: the machine and the exact plots it would work.
const VEH_NAME={tractor:'Tractor',seeder:'Seeder',harvester:'Harvester'};
function autoPlan(hx,hy){
  if(tool!=='multi'||VIS||placing||!S||S.autoVeh===false||S.tapMode==='walk'||!inGrid(hx,hy))return null;
  const key=target(hx,hy);if(key&&S.tiles[key].k!=='plot')return null;
  const kind=planAt(hx,hy),v=AUTO_VEH[kind];if(!v||!S.veh[v])return null;
  if(fuelNow()<fuelCost(v)&&!have('diesel'))return null;
  const want={tractor:'plow',seeder:'plant',harvester:'harvest'}[v],grass=!!effective(hx,hy).grass,n=vsize(v);
  const x0=Math.max(0,Math.min(N-n,hx-Math.floor((n-1)/2))),y0=Math.max(0,Math.min(N-n,hy-Math.floor((n-1)/2))),tiles=[];
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const x=x0+i,y=y0+j,k=planAt(x,y);if((k===want||(want==='harvest'&&k==='clear'))&&!!effective(x,y).grass===grass)tiles.push([x,y])}
  return tiles.length>=2?{v,tiles,n,x0,y0}:null;
}
let areaFlash=null;
function autoVehicle(kind,hx,hy){
  const pl=autoPlan(hx,hy);if(!pl)return false;const v=pl.v,cost=fuelCost(v),want={tractor:'plow',seeder:'plant',harvester:'harvest'}[v];
  if(fuelNow()<cost){if(!have('diesel'))return false;takeGood('diesel',1);S.fuel=Math.min(FUEL_MAX,S.fuel+CAN_FUEL);SFX.engine()}
  if(want==='harvest'){S.fuel-=cost;enqueue({kind:'harvest',tiles:pl.tiles,vehicle:v})}
  else if(queueKind(want,pl.tiles,v))S.fuel-=cost;else return true;
  areaFlash={tiles:pl.tiles,t:performance.now()};floatText(hx,hy-.8,VEH_NAME[v]+': '+pl.tiles.length+' plots','#fff3b0');hud();
  return true;
}
function drawArea(tiles,a){for(const[x,y]of tiles)poly([P(x+.06,y+.06),P(x+.94,y+.06),P(x+.94,y+.94),P(x+.06,y+.94)],'rgba(255,230,90,'+(.22*a).toFixed(3)+')','rgba(255,215,60,'+(.95*a).toFixed(3)+')',2)}
function finishJob(j,now){
  let xp=0,spent=0,full=false;const got={};
  for(const[x,y]of j.tiles){
    const k=x+','+y,o=S.tiles[k];

      if((!occ[k]||(o&&o.k==='plot'&&o.fallow))){if(!occ[k])xp+=1;S.tiles[k]={k:'plot',crop:null,t:0};stat('plow');burst(x,y,['#8b5a2e','#a87a4c']);spent+=(j.costs&&j.costs[k])||0}

          if(o.gold){const e=stash(o.crop,CROP_YIELD-1);got[o.crop]=(got[o.crop]||0)+e}
          if(n){got[id]=(got[id]||0)+n;harvested(o.crop,x,y);burst(x,y,o.gold?['#ffd23f','#fff7c0','#ffe066']:[s.c.fruit,'#ffe066']);fxAdd({k:'pop',x,y,s:sprite('c2:'+o.crop+':ripe',BOXC,()=>drawClumps(0,0,s.c,'ripe'))});flyToBarn(x,y,id,Math.min(n,room()+n));
            if(o.gold){stat('golden');SFX.golden();floatText(x,y-1.7,'Golden '+s.c.name+'!','#ffd23f',350)}
            S.tiles[k]={k:'plot',fallow:true}}else{full=true;shakePlot(k)}}
        else if(s.st==='withered'){toast('Those '+s.c.name.toLowerCase()+' withered. Plow and plant again.');S.tiles[k]={k:'plot',fallow:true}}
      }
    }else if(j.kind==='collect'){
      if(o&&(o.k==='animal'||o.k==='tree')){const def=defOf(o);if(readyIn(o,def,now)<=0){
        const id=(o.k==='animal'?'a_':'t_')+o.id,n=o.k==='animal'&&Math.random()<HOME_BONUS[HLV[o.id]||1]?2:1,added=stash(id,n);
        if(added){got[id]=(got[id]||0)+added;o.t=now;if(o.k==='animal'){o.fed=false;if(Math.random()<[0,.05,.08,.12][HLV[o.id]||1])babyBorn(o.id,x,y,now)}maybeMat(x,y,.12);xp+=def.xp;stat(o.k==='animal'?'animal':'tree');burst(x,y,['#fff',def.fruit||'#ffe066']);if(o.k==='tree')flyToBarn(x,y,id,added,50);drop(o.k==='animal'?'critters':'picnic',x,y)}else full=true;
      }}
    }else if(j.kind==='water'){
      if(o&&o.k==='plot'&&o.crop&&!o.wet){const s=cropState(o,now);if(s.st!=='ripe'&&s.st!=='withered'){o.wet=true;o.t-=s.left*300;stat('water');SFX.water();floatText(x,y-.6,'Watered! Grows faster','#bfe6ff')}}
    }else if(j.kind==='fertilize'){
      if(o&&o.k==='plot'&&o.crop&&!o.fert&&have('fert')>0){takeGood('fert',1);o.fert=true;if(!o.gold&&Math.random()<.08)o.gold=true;stat('fertilize');SFX.plant();floatText(x,y-.6,'Fertilized: double harvest','#c8f59a')}

      if(o&&hungry(o)){const need=feedNeed(o.id);if(have('feed')>=need){takeGood('feed',need);spent+=need;o.fed=true;o.t=now;stat('feed');burst(x,y,['#e8c25a','#c9a46a','#fff3b0']);if(x<=HX){const h=yardOf(k,o.id),G=homeGeo(o.id);if(h&&bigHome(S.tiles[h[0]+','+h[1]])&&!FX.some(f=>f.k==='pour'&&f.h===h))fxAdd({k:'pour',h,x:h[0]+G.tr[0]+.4,y:h[1]+G.tr[1]+.08})}}else{SFX.error();toast('Ran out of feed.')}}

// Happy animals sometimes have a baby: it appears next to its parent if their home has room, and grows up over a few cycles.
function babyBorn(id,x,y,now){
  buildOcc();if((ANC[id]||0)>=homeCap(id))return;
  if(x<=HX){const grow=Math.max(180,ANIMALS[id].every*3),k=freeHousedKey(),pk=x+','+y,r0=roamOf(pk),nx=+k.split(',')[0],wx=x+.5+r0.x,wy=y+.5+r0.y;
    S.tiles[k]={k:'animal',id,t:now,fed:true,baby:now+grow*1000};ROAM[k]={x:wx-(nx+.5)+.15,y:wy-.5+.1,tx:wx-(nx+.5)+.15,ty:wy-.5+.1,wait:2,f:1};buildOcc();
    stat('baby');setTimeout(()=>{SFX.baby();floatText(nx,0-1,'♥ Baby '+ANIMALS[id].name.toLowerCase()+'!','#ffb3d0');burst(nx,0,['#ffb3d0','#fff','#ffd23f']);toast('A baby '+ANIMALS[id].name.toLowerCase()+' was born! It grows up in '+fmt(grow)+'.')},400);
    return}
  for(let r=1;r<=2;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const bx=x+dx,by=y+dy,k=bx+','+by;if(!inGrid(bx,by)||occ[k]||pend[k])continue;
    const grow=Math.max(180,ANIMALS[id].every*3);S.tiles[k]={k:'animal',id,t:now,fed:true,baby:now+grow*1000};occ[k]=k;ANC[id]=(ANC[id]||0)+1;
    stat('baby');setTimeout(()=>{SFX.baby();floatText(bx,by-1,'♥ Baby '+ANIMALS[id].name.toLowerCase()+'!','#ffb3d0');burst(bx,by,['#ffb3d0','#fff','#ffd23f']);toast('A baby '+ANIMALS[id].name.toLowerCase()+' was born! It grows up in '+fmt(grow)+'.')},400);
    return;
  }

function harvested(id,x,y){

const CELE_ART={};
function celeArt(key,w,h,fn){
  if(CELE_ART[key])return CELE_ART[key];
  const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const prev=g;g=c.getContext('2d');g.scale(2,2);g.lineCap='round';g.lineJoin='round';
  try{fn(w,h)}catch(e){console.error(e)}g=prev;return CELE_ART[key]=c.toDataURL();
}

function rosetteArt(col,n){

    for(const s of[-1,1]){g.save();g.translate(cx+s*14,cy+22);g.rotate(s*.36);
      g.beginPath();g.moveTo(-15,0);g.lineTo(15,0);g.lineTo(16,90);g.lineTo(0,76);g.lineTo(-16,90);g.closePath();
      g.fillStyle=pvL(-16,0,16,0,[dk,lt,col,dk]);g.fill();g.strokeStyle=shade(col,-.6);g.lineWidth=1;g.stroke();
      g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.2;g.beginPath();g.moveTo(-10,4);g.lineTo(-10.6,80);g.moveTo(10,4);g.lineTo(10.6,80);g.stroke();
      g.fillStyle='rgba(0,0,0,.18)';g.fillRect(-12,0,24,8);g.restore()}
    const N=30;for(let i=0;i<N;i++){const a0=i/N*Math.PI*2,a1=(i+1)/N*Math.PI*2;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a0)*50,cy+Math.sin(a0)*50);g.quadraticCurveTo(cx+Math.cos((a0+a1)/2)*55,cy+Math.sin((a0+a1)/2)*55,cx+Math.cos(a1)*50,cy+Math.sin(a1)*50);g.closePath();
      g.fillStyle=i%2?shade(col,-.12):lt;g.fill()}
    g.beginPath();g.arc(cx,cy,52,0,7);g.strokeStyle=shade(col,-.55);g.lineWidth=1;g.stroke();
    g.fillStyle=pvR(cx,cy,52,['rgba(255,255,255,0)','rgba(255,255,255,0)','rgba(0,0,0,.22)']);g.beginPath();g.arc(cx,cy,52,0,7);g.fill();
    g.beginPath();g.arc(cx,cy,34,0,7);g.fillStyle=pvL(cx-34,cy-34,cx+34,cy+34,['#fff3a0','#e8b020','#a8700a','#f2c53a']);g.fill();g.strokeStyle='#6a4400';g.lineWidth=1.2;g.stroke();
    for(let i=0;i<36;i++){const a=i/36*Math.PI*2;g.beginPath();g.arc(cx+Math.cos(a)*31,cy+Math.sin(a)*31,.9,0,7);g.fillStyle='rgba(255,250,210,.8)';g.fill()}
    g.beginPath();g.arc(cx,cy,26,0,7);g.fillStyle=pvR(cx-6,cy-8,30,['#ffffff','#fff6dc','#e8d4a8']);g.fill();g.strokeStyle='#a8700a';g.lineWidth=1;g.stroke();
    g.font='34px "Luckiest Guy", Impact';g.textAlign='center';g.lineWidth=5;g.strokeStyle='#fffaf0';g.strokeText(n,cx,cy+12);g.fillStyle='#4a2a10';g.fillText(n,cx,cy+12);
    g.beginPath();g.ellipse(cx-12,cy-14,10,5,-.6,0,7);g.fillStyle='rgba(255,255,255,.55)';g.fill();pvSpark(cx+30,cy-34,5);
  });
}
// a bevelled gold star with the level number
function levelStarArt(lv){

    const cx=75,cy=78,R=68,r=30,pt=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;pt.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}
    g.save();g.translate(3,5);g.beginPath();pt.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath();g.fillStyle='rgba(90,50,0,.35)';g.fill();g.restore();

function readCode(c){
  c=String(c||'').replace(/\s+/g,'');if(c.startsWith('FV1.'))c=c.slice(4);
  try{const s=JSON.parse(decodeURIComponent(escape(atob(c))));return valid(s)?s:null}catch(e){return null}

const ICONS={};let ICON_MODE=false,ICON_BARE=false;
// Market art is drawn at twice the size, then cropped to what was painted so it fills the card.
const ICON_R=2;
function cropIcon(c,W2,H2,pad,maxUp){
  const x=c.getContext('2d'),w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y+=2)for(let i=0;i<w;i+=2)if(d[(y*w+i)*4+3]>12){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return c;x0=Math.max(0,x0-2);y0=Math.max(0,y0-2);x1=Math.min(w-1,x1+2);y1=Math.min(h-1,y1+2);
  const bw=x1-x0+1,bh=y1-y0+1,o=document.createElement('canvas');o.width=W2;o.height=H2;
  const k=Math.min((W2-2*pad)/bw,(H2-2*pad)/bh,maxUp),dw=bw*k,dh=bh*k;o.getContext('2d').drawImage(c,x0,y0,bw,bh,(W2-dw)/2,H2-pad-dh,dw,dh);return o;
}
// a round patch of lawn with a few tufts, for animals and trees
let ICON_PATCH=31;
function iconPatch(tf){
  const[cx,cy]=P(.5,.5),R0=ICON_PATCH;g.save();g.translate(cx,cy);g.scale(1,.5);g.beginPath();g.arc(0,0,R0,0,7);g.restore();
  g.fillStyle=tf;g.fill();g.save();g.translate(cx,cy);g.scale(1,.5);const gr=g.createRadialGradient(0,-6,4,0,0,R0);gr.addColorStop(0,'rgba(255,255,220,.18)');gr.addColorStop(.7,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(30,50,10,.32)');g.fillStyle=gr;g.beginPath();g.arc(0,0,R0,0,7);g.fill();g.restore();
  g.lineCap='round';for(let i=0;i<34;i++){const a=i/34*Math.PI*2+hash(i,2)*.2,ex=cx+Math.cos(a)*(R0-1),ey=cy+Math.sin(a)*(R0-1)/2;g.strokeStyle=i%3?'#5f8f32':'#79a845';g.lineWidth=.9;g.beginPath();g.moveTo(ex,ey);g.lineTo(ex+(hash(i,4)-.5)*2.4,ey-2-hash(4,i)*2.6);g.stroke()}
}
// seeds come in a paper packet with the crop painted on the front; the crop itself sits in front of it
const PACKET_COL={spring:'#d9577e',summer:'#e39a1c',autumn:'#c2582a',winter:'#3f80c4'};
function seedPacket(id){
  const col=PACKET_COL[CROP_SEASON[id]]||'#4e8a3a',dk=shade(col,-.35),w=96,h=136;
  g.save();g.translate(92,92);g.rotate(-.11);
  g.fillStyle='rgba(40,26,10,.22)';g.beginPath();g.roundRect(-w/2+5,-h/2+7,w,h,5);g.fill();
  g.beginPath();g.moveTo(-w/2,-h/2+10);for(let i=0;i<=12;i++)g.lineTo(-w/2+i*w/12,-h/2+(i%2?4:10));g.lineTo(w/2,h/2-4);g.quadraticCurveTo(w/2,h/2,w/2-4,h/2);g.lineTo(-w/2+4,h/2);g.quadraticCurveTo(-w/2,h/2,-w/2,h/2-4);g.closePath();
  g.fillStyle=pvL(-w/2,0,w/2,0,['#f4ead2','#fffaf0','#efe2c4']);g.fill();g.strokeStyle='rgba(110,80,40,.45)';g.lineWidth=1;g.stroke();
  g.save();g.clip();g.fillStyle=col;g.fillRect(-w/2,-h/2,w,26);g.fillStyle=dk;g.fillRect(-w/2,-h/2+24,w,3);
  g.fillStyle=col;g.fillRect(-w/2,h/2-24,w,24);g.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<7;i++){g.beginPath();g.ellipse(-30+i*10,h/2-12,2.2,3.2,.5,0,7);g.fill()}
  g.fillStyle='rgba(255,255,255,.75)';g.fillRect(-w/2+12,-h/2+12,w-24,3);g.fillRect(-w/2+22,-h/2+18,w-44,2.4);
  g.fillStyle='rgba(120,80,30,.08)';for(let i=0;i<40;i++)g.fillRect(-w/2+hash(i,1)*w,-h/2+hash(1,i)*h,1.4,1.4);
  g.restore();
  g.beginPath();g.roundRect(-w/2+9,-h/2+32,w-18,h-62,6);g.fillStyle=pvL(0,-h/2+32,0,h/2-30,['#dff0fb','#f4fae8','#cfe6a8']);g.fill();g.strokeStyle=shade(col,-.2);g.lineWidth=1.6;g.stroke();
  const pc=prodCanvas(id);if(pc)g.drawImage(pc,-w/2+10,-h/2+30,w-20,w-20);
  g.restore();
  const pc2=prodCanvas(id);if(pc2)g.drawImage(pc2,118,64,118,118);
}
function renderIcon(cat,id,lv,bare){
  const R=ICON_R,c=document.createElement('canvas');c.width=240*R;c.height=200*R;
  const prev=g;g=c.getContext('2d');const now=Date.now();ICON_MODE=true;ICON_BARE=!!bare;
  try{
  const tall=cat==='trees'||(cat==='decor'&&['windmill','silo','balloon','scarecrow','lamp','arbor','towerclock'].includes(id));
  const big=(cat==='decor'&&DECOR[id].size===2)||cat==='homes'||cat==='buildings',pen=cat==='homes';
  const sc=pen?.9:big?1.25:tall?1.6:2.2;g.setTransform(sc*R,0,0,sc*R,120*R,(pen?72:big?70:tall?122:96)*R);
  const tf=NATURAL?grassPat():'#7cc63e',ts=NATURAL?'rgba(52,74,26,.35)':'#5d9a2c';
  if(cat==='seeds'){g.setTransform(R,0,0,R,0,0);seedPacket(id)}
  else if(cat==='farm'){g.setTransform(2*R,0,0,2*R,120*R,96*R);if(!bare&&FARM[id].kind!=='expand')poly(quad(0,0),tf,ts,1);drawFarmIcon(id,now)}
  else{
    if(cat==='animals'||cat==='trees'){ICON_PATCH=cat==='animals'?({cow:25,horse:27,llama:24,goat:22,pig:22,sheep:22}[id]||18):26;if(!bare)iconPatch(tf)}
    else if(!bare)poly(pen?[P(0,0),P(3,0),P(3,3),P(0,3)]:big?[P(0,0),P(2,0),P(2,2),P(0,2)]:quad(0,0),tf,ts,1);
    if(cat==='animals')drawObj(0,0,{k:'animal',id,t:now-1e9},now);
    else if(cat==='trees')drawObj(0,0,{k:'tree',id,t:now-1e9},now);
    else if(cat==='homes'){drawHome3(0,0,id,lv||1);const G=homeGeo(id),sc2=SPEC_SC[id]||1;for(const[u,v]of[[1.2,2.2],[2.1,1.9]]){const[ax,ay]=P(u,v);g.save();g.translate(ax,ay);g.scale(sc2,sc2);ANIMAL_DRAW[id](0,0,0,0);g.restore()}drawHomeFront(0,0,id)}
    else if(cat==='buildings')drawMaker(0,0,id);
    else drawObj(0,0,{k:'deco',id},now);
  }
  }finally{g=prev;ICON_MODE=false;ICON_BARE=false}
  return cropIcon(c,240*R,200*R,6*R,cat==='seeds'?1:2.2).toDataURL();
}
function drawFarmIcon(id,now){
  const[px,py]=P(.5,.5);
  if(FARM[id].kind==='vehicle'){g.save();g.translate(px+3,py+2);g.scale(.9,.9);drawVehicle(id,now,false,false);g.restore();return}
  if(FARM[id].kind==='supply'){drawGood(FARM[id].item,px,py-12,2.1);return}
  if(FARM[id].kind==='pet'){g.save();g.translate(px-4,py+4);g.scale(2,2);drawPet(FARM[id].pet,{sit:true,happy:true},now);g.restore();return}
  if(FARM[id].kind==='expand'){g.drawImage(expandArt(FARM[id].to+'x'+FARM[id].to),px-34,py-50,68,68);return}
  const k=FARM[id].kind;
  const art=(n,x,y,w)=>{const c=prodCanvas(n);if(c)g.drawImage(c,x-w/2,y-w,w,w)};
  if(k==='fuel')art('x_fuel',px,py+8,56);
  else if(k==='grow')art('x_grow',px,py+8,58);
  else{
    const sv=farmer.job;farmer.job={kind:k==='feed'?'collect':'harvest'};
    const sx=farmer.x,sy=farmer.y,st=farmer.state;farmer.x=.55;farmer.y=.55;farmer.state='work';farmer.t=0;farmer.dir=1;
    drawFarmer(now);farmer.job=sv;farmer.x=sx;farmer.y=sy;farmer.state=st;
    // what each helper brings in: a sheaf of the harvest, a basket of apples, eggs and milk
    if(k==='farmhand')art('wheat',px-15,py+4,26);else if(k==='arborist')art('t_apple',px+15,py+4,24);else if(k==='feed'){art('a_chicken',px-15,py+4,22);art('a_cow',px+15,py+3,20)}
  }
}

function flyCoin(r,from,to){

}

// Neighbors swap boards, nails, bricks and paint for farm goods. Four offers at a time; a fresh set every 4 hours,
// and a used offer is replaced after 30 minutes. Open from the first level on.
let TRADE_WHO=NEIGHBORS.map(n=>n.id);
const TRADE_SLOT=4*3600e3,MAT_VALUE={board:60,nail:60,brick:110,paint:140};
function tradeState(){
  const slot=Math.floor(Date.now()/TRADE_SLOT);
  if(!S.trades||S.trades.slot!==slot){TRADE_WHO=NEIGHBORS.map(n=>n.id).sort(()=>Math.random()-.5);S.trades={slot,offers:[0,1,2,3].map(i=>newTrade(i))}}
  const now=Date.now();S.trades.offers.forEach((o,i)=>{if(o.done&&now>=o.done)S.trades.offers[i]=newTrade(i)});
  return S.trades;
}
function newTrade(i){
  const R=Math.random,pick=a=>a[Math.floor(R()*a.length)],who=TRADE_WHO[i%TRADE_WHO.length];
  const mats=S.level<4?['board','nail','board','nail','paint']:['board','nail','brick','paint','board','nail','brick'];
  // the last offer swaps one material for another; the others ask for goods
  if(i===3&&S.level>=3){const give=pick(Object.keys(MATS)),get=pick(Object.keys(MATS).filter(k=>k!==give)),n=1+Math.floor(R()*2);
    return{who,give:[['m:'+give,Math.ceil(n*MAT_VALUE[get]/MAT_VALUE[give]*1.25)]],get:[[get,n]]}}
  const up=BARN_UP[barnLv()],missing=up?Object.keys(up.mats).filter(k=>(S.mats[k]||0)<up.mats[k]):[];
  const get=[[missing.length&&R()<.65?pick(missing):pick(mats),1+Math.floor(R()*(S.level<4?2:3))]];if(S.level>=6&&R()<.35){const m2=pick(mats.filter(k=>k!==get[0][0]));get.push([m2,1+Math.floor(R()*2)])}
  const value=get.reduce((a,[k,n])=>a+MAT_VALUE[k]*n,0)*1.5;
  const pool=orderPool().filter(id=>ITEMS[id].cat!=='made'||S.level>=6),inBarn=pool.filter(id=>have(id)>0);
  const id=pick(inBarn.length&&R()<.7?inBarn:pool.length?pool:['wheat']);
  return{who,give:[[id,Math.max(1,Math.round(value/ITEMS[id].sell))]],get};
}
function tradeHas([id,n]){return id.startsWith('m:')?(S.mats[id.slice(2)]||0)>=n:have(id)>=n}
function canTrade2(o){return!o.done&&o.give.every(tradeHas)}
function doTrade(o){
  if(!canTrade2(o)){SFX.error();toast('You do not have everything for this trade yet.');return}
  const room0=room()+o.give.reduce((a,[id,n])=>a+n,0);if(o.get.reduce((a,[,n])=>a+n,0)>room0){barnFull();return}
  for(const[id,n]of o.give){if(id.startsWith('m:'))S.mats[id.slice(2)]-=n;else takeGood(id,n)}
  for(const[k,n]of o.get)S.mats[k]=(S.mats[k]||0)+n;
  o.done=Date.now()+1800e3;stat('trades');SFX.coin();setTimeout(SFX.find,150);
  const nb=NEIGHBORS.find(x=>x.id===o.who);toast(nb.name+' traded with you: '+o.get.map(([k,n])=>MATS[k].name+' ×'+n).join(', ')+'.');
  changed();rerender();
}
function matChip(k,n,ok){const r=el('span','req'+(ok?' ok':''));r.innerHTML=MATS[k].svg;r.appendChild(el('b',null,(ok?'+':'')+n));r.title=MATS[k].name;r.setAttribute('aria-label',MATS[k].name+': '+n);return r}
function tradeReady(){if(!S)return false;const t=tradeState();return t.offers.some(canTrade2)}
function showTrades(){

  modal({title:'Neighbor Trades',color:'green',wide:true,live:true,render(b){
    const t=tradeState(),now=Date.now(),w=el('div','orders');
    w.appendChild(el('p','hint','Your neighbors swap building materials for farm goods. Use them to upgrade your barn and animal homes.'));
    const have2=el('div','want');for(const k in MATS)have2.appendChild(matChip(k,S.mats[k]||0,false));w.appendChild(have2);
    for(const o of t.offers){

      mid.appendChild(el('small',null,'In return for'));
      const gives=el('div','want');for(const[id,n]of o.give){if(id.startsWith('m:'))gives.appendChild(matChip(id.slice(2),(S.mats[id.slice(2)]||0)+'/'+n,false));else gives.appendChild(goodReq(id,n))}mid.appendChild(gives);
      row.appendChild(mid);

// One day on the farm lasts 16 minutes: a long day, a golden dusk, a short starry night and a dawn.
const DAY_LEN=960;
function dayPhase(){return(Date.now()/1000%DAY_LEN)/DAY_LEN}
function darkness(){const p=dayPhase();if(p<.62)return 0;if(p<.72)return(p-.62)/.1;if(p<.9)return 1;return 1-(p-.9)/.1}

function nightLights(){
  const out=[];
  for(const k in S.tiles){const o=S.tiles[k],[x,y]=k.split(',').map(Number);
    if(o.k==='bld')out.push([...P(x+1,y+1.2,o.id==='house'?16:12),o.id==='house'?95:60]);
    else if(o.k==='home')out.push([...P(x+1,y+1,10),55]);

  // quarter resolution, redrawn only when the light level or the camera moves
  const q=.25,w=Math.max(1,Math.round(vw*q)),h=Math.max(1,Math.round(vh*q)),L=nightLights();
  const key=[w,h,d.toFixed(2),Math.round(cam.x),Math.round(cam.y),cam.z.toFixed(3),L.length].join();if(key===nightKey)return;nightKey=key;

  x.globalCompositeOperation='source-over';x.clearRect(0,0,w,h);

const SPR_MAX=100,SPR_USE=10,SPR_R=2,SPR_FILL=40;
function sprinklerTick(now,w){
  if(VIS)return;
  for(const k in S.tiles){const o=S.tiles[k];if(o.k!=='deco'||o.id!=='sprinkler')continue;
    if(o.w==null)o.w=60;
    o.w=Math.min(SPR_MAX,o.w+(w==='rain'||w==='storm'?6:w==='snow'?2:w==='cloudy'?.12:.06));
    if(o.w<SPR_USE)continue;
    const[x,y]=k.split(',').map(Number);
    for(let dy=-SPR_R;dy<=SPR_R;dy++)for(let dx=-SPR_R;dx<=SPR_R;dx++){
      const q=S.tiles[(x+dx)+','+(y+dy)];if(!q||q.k!=='plot'||!q.crop||q.wet)continue;
      const st=cropState(q,now);if(st.st==='ripe'||st.st==='withered')continue;
      q.wet=true;q.t-=st.left*300;o.w-=SPR_USE;o.sprayT=now+1600;stat('water');
      const[px,py]=P(x+dx+.5,y+dy+.5);spray(px,py-6,10,{c:['#bfe6ff','#8fd0f5','#fff'],v:1.4,r:1.5,gr:.1,life:.6});
      if(Math.random()<.5)nz(.4,{f:3000,q:.6,vol:.04,at:.05});
      dx=dy=99;
    }
  }
}

      card.appendChild(btn);g2.appendChild(card)}
    p.appendChild(g2);b.appendChild(p);
  }});
}
$('hEat').onclick=()=>{SFX.click();showMeals()};
$('hDrinkBtn').onclick=()=>{SFX.click();eatMeal(MEALS[0])};
$('hShower').onclick=()=>{SFX.click();doShower()};
$('hNap').onclick=()=>{SFX.click();doNap()};
$('hShop').onclick=()=>{SFX.click();showFurniture()};
$('hLeave').onclick=leaveHouse;
$('needPill').onclick=()=>{if(VIS)return;enterHouse()};

/* ================= boot ================= */
function start(data){
  S=norm(valid(data&&data.S)?data.S:(load()||fresh()));
  if(S.size===24)S.size=25;N=S.size;migrateHomes();
  // an old bug let upgrades go through without enough coins or materials; never keep a negative balance
  if(S.coins<0)S.coins=0;if(S.mats)for(const k in S.mats)if(S.mats[k]<0)S.mats[k]=0;
  for(const k in S.tiles){const o=S.tiles[k];if(o.k==='bld'){farmer.x=+k.split(',')[0]+2.4;farmer.y=+k.split(',')[1]+2.6;break}}
  resize();buildBorder();buildOcc();if(syncHousing())buildOcc();buildBars();renderModeSw();houseSt();renderNeeds();renderNeighbors();hud();save();placePet();setTool('multi');
  window.claude?.hot?.snapshot?.(()=>({S}));
  requestAnimationFrame(frame);
  setInterval(save,10000);
  const first=!S.tips.welcome;S.tips.welcome=true;
  if(S.tips.homeGift===false){S.tips.homeGift=true;setTimeout(()=>toast('Animals now live in homes! Free homes for your animals are waiting in your Gift Box.'),1500)}
  else if(!S.tips.homes&&Object.values(S.tiles).some(o=>o.k==='animal'&&!hasHome(o.id))){S.tips.homes=true;setTimeout(()=>toast('Your chickens and sheep need homes! Buy a Chicken Coop and a Sheep Pen in Market > Homes.'),3200)}
  if(first)toast('Welcome to Farm Village! Your wheat is ready: click it and your farmer will harvest it.');
  if(!S.tips.avatar)showWardrobe(true);
  dailyBonus();
  renderGoals();setInterval(()=>{if(S.goals&&S.goals.day!==today())renderGoals()},60000);
  tickOrders();tickDeliv();renderQuest();setTimeout(()=>{if($('title').hidden)nextQuest()},4000);
  showTitle();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
// Installed-app support: works offline once loaded. Skipped where service workers are not allowed (for example inside claude.ai).
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude\.ai$/.test(location.hostname))navigator.serviceWorker.register('sw.js').then(r=>{addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})});
  // a new version finished installing while this page was open: offer a one-tap reload
  const had=!!navigator.serviceWorker.controller;r.addEventListener('updatefound',()=>{const w=r.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='activated'&&had&&!$('updBar')){const b=document.createElement('button');b.id='updBar';b.className='updbar';b.textContent=tr('A new version is ready. Tap to reload.');b.onclick=()=>location.reload();document.body.appendChild(b)}})})}).catch(()=>{});
let installEvt=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});addEventListener('appinstalled',()=>{installEvt=null;toast('Farm Village is installed!')});
})();
